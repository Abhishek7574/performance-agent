<body>
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">&#9776;</button>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <h2>PerformaX AI</h2>
                <div class="brand-sub">From Validation to Value &ndash; AI that Drives Always-On Performance</div>
            </div>
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" id="tabHistory" onclick="switchSidebarTab('history')">History</button>
                <button class="sidebar-tab" id="tabActions" onclick="switchSidebarTab('actions')">Agent Actions</button>
            </div>
            <div class="sidebar-header" id="historyHeader">
                <h3>History</h3>
                <button class="clear-all-btn" onclick="clearHistory()">Clear</button>
            </div>
            <div class="sidebar-search" id="historySearch">
                <input type="text" id="historyFilter" placeholder="Search history..." oninput="renderHistory(this.value)">
            </div>
            <div class="sidebar-history" id="sidebarHistory">
                <div class="sidebar-empty">No searches yet</div>
            </div>
            <div class="sidebar-actions" id="sidebarActions">
                <div class="sidebar-empty">No agent actions yet</div>
            </div>
            <div class="sidebar-footer">
                <button class="new-chat-btn" onclick="newChat()">+ New Conversation</button>
            </div>
        </div>

        <!-- Chat column -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="agent-avatar">P</div>
                <div class="header-info">
                    <h1>PerformaX AI</h1>
                    <div class="status"><span class="status-pulse-dot"></span> Online &middot; Ready to assist</div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-card">
                    <div class="welcome-icon">P</div>
                    <h3>Welcome to PerformaX AI</h3>
                    <p>Ask me about cloud infrastructure — performance, processes, logs, health, or overall dashboard.</p>
                    <div class="welcome-chips">
                        <button class="welcome-chip" onclick="sendRecommendation(this)">Show CPU for last 7 days</button>
                        <button class="welcome-chip" onclick="sendRecommendation(this)">Memory usage of web app</button>
                        <button class="welcome-chip" onclick="sendRecommendation(this)">Azure dashboard overview</button>
                        <button class="welcome-chip" onclick="sendRecommendation(this)">Is my infrastructure healthy?</button>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleCsvUpload(event)">
                    <input
                        type="text"
                        class="chat-input"
                        id="chatInput"
                        placeholder="Type your message..."
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="send-button" id="sendButton" onclick="sendMessage()">
                        Send
                    </button>
                    <button class="cancel-button" id="cancelButton" onclick="cancelQuery()" style="display:none">
                        &#x25A0; Stop
                    </button>
                </div>
            </div>
        </div> <!-- /chat-container -->
    </div> <!-- /app-wrapper -->

    <script>
        const API_BASE_URL = globalThis.location.origin;
        let SESSION_ID = 'user_' + Date.now();
        const HISTORY_KEY = 'hwSearchHistory';
        const MAX_HISTORY = 50;
        let isProcessing = false;
        let _abortController = null;

        /* ── CSV upload handler (Doppelio) ─────────────────── */
        async function handleCsvUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileInput = event.target;
            fileInput.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const resp = await fetch(`${API_BASE_URL}/api/upload-csv`, {
                    method: 'POST',
                    body: formData,
                });
                if (resp.ok) {
                    const data = await resp.json();
                    // Show only filename in the chat UI
                    addMessage(`CSV file name: ${data.filename}`, true);
                    // Send full path to the agent (hidden from UI)
                    runQuery(
                        `CSV file name: ${data.filename}. File saved at: ${data.file_path}. Please upload this to Doppelio.`,
                        { showUserBubble: false, save: false }
                    );
                } else {
                    const err = await resp.text();
                    addMessage(`CSV upload failed: ${err}`, false);
                }
            } catch (e) {
                addMessage(`CSV upload error: ${e.message}`, false);
            } finally {
                fileInput.disabled = false;
                // Reset so the same file can be re-selected
                fileInput.value = '';
            }
        }

        /* ── Conversation history (localStorage) ─────── */
        function getHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
            catch (e) {
                console.debug('Failed to parse history from localStorage:', e);
                return [];
            }
        }
        function saveToHistory(query) {
            let h = getHistory();
            if (h.length && h[0].query === query) return;
            h.unshift({ query, timestamp: Date.now() });
            if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
            renderHistory();
        }
        function deleteHistoryItem(i, ev) {
            ev.stopPropagation();
            const h = getHistory();
            h.splice(i, 1);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
            renderHistory();
        }
        function clearHistory() {
            localStorage.removeItem(HISTORY_KEY);
            renderHistory();
        }
        function timeAgo(ts) {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'just now';
            const m = Math.floor(s / 60);
            if (m < 60) return m + 'm ago';
            const hr = Math.floor(m / 60);
            if (hr < 24) return hr + 'h ago';
            const d = Math.floor(hr / 24);
            if (d === 1) return 'yesterday';
            if (d < 7) return d + 'd ago';
            return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        function renderHistory(filter) {
            const box = document.getElementById('sidebarHistory');
            let h = getHistory();
            const f = (filter || (document.getElementById('historyFilter') || {}).value || '').toLowerCase().trim();
            if (f) h = h.filter(i => i.query.toLowerCase().includes(f));
            if (h.length === 0) {
                box.innerHTML = '<div class="sidebar-empty">' + (f ? 'No matches' : 'No searches yet') + '</div>';
                return;
            }
            
            // Helper to escape HTML for safe rendering
            function safeHtml(t) {
                const d = document.createElement('div');
                d.textContent = t;
                return d.innerHTML;
            }
            
            let html = '';
            h.forEach((item, i) => {
                // Escape backslashes and single quotes for onclick attribute
                const escapedQuery = JSON.stringify(item.query).slice(1, -1).replace('"', '&quot;');
                html += '<div class="history-item" onclick="replayQuery(\'' + escapedQuery + '\')">'
                     + '<div class="history-query">' + safeHtml(item.query) + '</div>'
                     + '<div class="history-time">' + timeAgo(item.timestamp) + '</div>'
                     + '<button class="edit-btn" onclick="editQuery(\'' + escapedQuery + '\', event)" title="Edit prompt">✎</button>'
                     + '<button class="delete-btn" onclick="deleteHistoryItem(' + i + ', event)">&times;</button>'
                     + '</div>';
            });
            box.innerHTML = html;
        }
        function replayQuery(q) {
            document.getElementById('chatInput').value = q;
            sendMessage();
            if (window.innerWidth <= 768) toggleSidebar();
        }
        function editQuery(q, ev) {
            ev.stopPropagation();
            const input = document.getElementById('chatInput');
            input.value = q;
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            if (window.innerWidth <= 768) toggleSidebar();
        }
        
        function newChat() {
            document.getElementById('chatMessages').innerHTML =
                '<div class="welcome-card">'
              + '<div class="welcome-icon">P</div>'
              + '<h3>Welcome to PerformaX AI</h3>'
              + '<p>Ask me about cloud infrastructure \u2014 performance, processes, logs, health, or overall dashboard.</p>'
              + '<div class="welcome-chips">'
              +   '<button class="welcome-chip" onclick="sendRecommendation(this)">Show CPU for last 7 days</button>'
              +   '<button class="welcome-chip" onclick="sendRecommendation(this)">Memory usage of web app</button>'
              +   '<button class="welcome-chip" onclick="sendRecommendation(this)">Azure dashboard overview</button>'
              +   '<button class="welcome-chip" onclick="sendRecommendation(this)">Is my infrastructure healthy?</button>'
              + '</div></div>';
        }
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        function showError(msg) {
            const box = document.getElementById('chatMessages');
            const e = document.createElement('div');
            e.className = 'error-message';
            e.textContent = msg;
            box.appendChild(e);
            setTimeout(() => e.remove(), 5000);
            scrollToBottom();
        }

        /* ── Markdown helpers ──────────────────────────── */

        /* Inline-only formatting (bold, italic, inline code, badges) */
        function formatInline(text) {
            if (!text) return '';
            // Bold
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Italic
            text = text.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
            // Inline code - only short tokens without spaces
            text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
            // Checkmark / cross emojis → styled badges
            text = text.replace(/✅\s*/g, '<span class="badge-ok">✓</span> ');
            text = text.replace(/❌\s*/g, '<span class="badge-err">✗</span> ');
            // Running / Healthy keywords in table cells
            text = text.replace(/\bRunning\b/g, '<span class="badge-running">● Running</span>');
            text = text.replace(/\bHealthy\b/g, '<span class="badge-healthy">✓ Healthy</span>');
            text = text.replace('→', '&rarr;');
            return text;
        }

        /* Legacy formatMarkdown - kept for use in old renderers */
        function formatMarkdown(text) {
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
            text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
            text = text.replace('→', '&rarr;');
            return text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /* ── Parse markdown pipe table → HTML table ──── */
        function parseMarkdownTable(tableLines) {
            if (!tableLines.length) return '';
            // Filter out separator lines like |---|---|
            const dataLines = tableLines.filter(l => !/^\|[\s\-:|]+\|$/.test(l.trim()));
            if (dataLines.length < 1) return '';

            const parseRow = (line) => {
                return line.trim().split('|')
                    .map(c => c.trim())
                    .filter((_, idx, arr) => idx > 0 && idx < arr.length - 1);
            };

            const headers = parseRow(dataLines[0]);
            const rows    = dataLines.slice(1);

            let html = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
            headers.forEach(h => { html += `<th>${formatInline(h)}</th>`; });
            html += '</tr></thead><tbody>';
            rows.forEach(row => {
                const cells = parseRow(row);
                if (!cells.length || cells.every(c => !c)) return;
                html += '<tr>';
                cells.forEach(cell => { html += `<td>${formatInline(cell)}</td>`; });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }

        function consumeCodeBlock(lines, i) {
            const trimmed = lines[i].trim();
            const langMatch = trimmed.match(/^```(\w+)?/);
            const lang = (langMatch && langMatch[1]) ? langMatch[1].toLowerCase() : '';
            const langDisplay = lang ? lang.toUpperCase() : 'CODE';
            const codeLines = [];
            i++;
            while (i < lines.length && !/^```\s*$/.test(lines[i].trim())) {
                codeLines.push(lines[i]);
                i++;
            }
            i++;
            const code = codeLines.join('\n');
            const blockHtml = `<div class="code-block-wrap">
                        <div class="code-block-toolbar">
                            <span class="code-block-toolbar-title">Script</span>
                            <span class="code-block-toolbar-lang">${escapeHtml(langDisplay)}</span>
                        </div>
                        <pre><code>${escapeHtml(code)}</code></pre>
                    </div>`;
            return { blockHtml, nextI: i };
        }

        function consumeTable(lines, i) {
            const tableLines = [];
            while (i < lines.length && /^\|/.test(lines[i].trim())) {
                tableLines.push(lines[i].trim());
                i++;
            }
            return { blockHtml: parseMarkdownTable(tableLines), nextI: i };
        }

        function headingHtml(trimmed) {
            const h3 = trimmed.match(/^###\s+(.+)$/);
            if (h3) return `<div class="md-h3">${formatInline(h3[1])}</div>`;
            const h2 = trimmed.match(/^##\s+(.+)$/);
            if (h2) return `<div class="md-h2">${formatInline(h2[1])}</div>`;
            const h1 = trimmed.match(/^#\s+(.+)$/);
            if (h1) return `<div class="md-h1">${formatInline(h1[1])}</div>`;
            return null;
        }

        /* ── Full markdown renderer (headings + tables + code blocks) ── */
        function renderFullMarkdown(text) {
            text = text.replace('\r\n', '\n').replace('\r', '\n');

            const lines = text.split('\n');
            let html = '<div class="md-full">';
            let i = 0;

            while (i < lines.length) {
                const raw     = lines[i];
                const trimmed = raw.trim();

                if (/^```/.test(trimmed)) {
                    const { blockHtml, nextI } = consumeCodeBlock(lines, i);
                    html += blockHtml;
                    i = nextI;
                    continue;
                }

                if (/^\|/.test(trimmed)) {
                    const { blockHtml, nextI } = consumeTable(lines, i);
                    html += blockHtml;
                    i = nextI;
                    continue;
                }

                const hHtml = headingHtml(trimmed);
                if (hHtml) { html += hHtml; i++; continue; }

                if (/^(-{3,}|\*{3,}|_{3,}|={3,})$/.test(trimmed)) {
                    html += '<hr class="md-hr">'; i++; continue;
                }

                if (/^[•\-*]\s+/.test(trimmed)) {
                    html += `<div class="md-bullet-item"><span class="md-bullet-dot">•</span><span>${formatInline(trimmed.replace(/^[•\-*]\s+/, ''))}</span></div>`;
                    i++; continue;
                }

                const numItem = trimmed.match(/^(\d+)[.)]\s+(.+)$/);
                if (numItem) {
                    html += `<div class="md-num-item"><span class="md-num-badge">${numItem[1]}</span><span>${formatInline(numItem[2])}</span></div>`;
                    i++; continue;
                }

                if (!trimmed) { html += '<div class="md-spacer"></div>'; i++; continue; }

                html += `<p class="md-para">${formatInline(trimmed)}</p>`;
                i++;
            }

            html += '</div>';
            return html;
        }

        /* ── Anomaly section renderer ──────────────────── */
        function renderAnomalySection(text) {
            // Split off any content before the anomaly heading (e.g. a Service Health block)
            const anomalyIdx = text.indexOf('### ⚠ Anomalies Detected');
            let prefix = '';
            let anomalyText = text;
            if (anomalyIdx > 0) {
                prefix = renderFullMarkdown(text.substring(0, anomalyIdx));
                anomalyText = text.substring(anomalyIdx);
            }
            // Parse bullet lines: - **Name**: spike detected at HH:MM — peak X unit (baseline avg Y unit, N pts)
            const bullets = anomalyText.split('\n').filter(l => /^[-*]\s/.test(l.trim()));
            if (!bullets.length) return prefix + renderFullMarkdown(anomalyText);

            const cardObjects = bullets.map(line => {
                const nameM = line.match(/\*\*([^*]+)\*\*/);
                // New format: "currently X unit — Nx above normal (typical avg Y unit)"
                // Also handles old format: "peak X unit" for backward compat
                const currM = line.match(/currently\s+([\d.,]+)\s*(\S+)/i) || line.match(/peak\s+([\d.,]+)\s*(\S+)/i);
                const baseM = line.match(/typical avg\s+([\d.,]+)\s*(\S+)/i) || line.match(/baseline avg\s+([\d.,]+)\s*(\S+)/i);
                const name  = nameM ? nameM[1] : 'Unknown metric';
                const cv = currM ? parseFloat(currM[1].replace(',', '')) : 0;
                const bv = baseM ? parseFloat(baseM[1].replace(',', '')) : 1;
                const ratio  = bv > 0 ? cv / bv : 0;
                const sev    = ratio > 10 ? 'critical' : ratio > 3 ? 'high' : 'medium';
                const sevStyles = {
                    critical: { border: '#c0392b', bg: '#fdecea', badge: '#c0392b', label: 'Critical' },
                    high:     { border: '#e67e22', bg: '#fef3e2', badge: '#e67e22', label: 'High'     },
                    medium:   { border: '#f0b429', bg: '#fffbea', badge: '#f0b429', label: 'Warning'  },
                };
                const s        = sevStyles[sev];
                const currStr  = currM ? fmtValueWithUnit(cv, currM[2]) : '—';
                const baseStr  = baseM ? fmtValueWithUnit(bv, baseM[2]) : '—';
                const ratioStr = bv > 0 ? fmtRatio(ratio) : '—';
                const html = `<div style="border-left:3px solid ${s.border};background:${s.bg};border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;">
                    <span style="font-size:18px;line-height:1.2">⚠</span>
                    <div style="flex:1;min-width:0">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
                            <strong style="color:#1a1a1a">${escapeHTML(name)}</strong>
                            <span style="font-size:11px;font-weight:600;color:#fff;background:${s.badge};border-radius:3px;padding:1px 6px">${s.label}</span>
                            <span style="font-size:12px;font-weight:700;color:${s.border}">${ratioStr} above normal</span>
                        </div>
                        <div style="font-size:13px;color:#555;display:flex;gap:16px;flex-wrap:wrap">
                            <span>Currently <strong style="color:${s.border}">${currStr}</strong></span>
                            <span>Typical avg <strong>${baseStr}</strong></span>
                        </div>
                    </div>
                </div>`;
                return { html, ratio, sev };
            });
            const _sevOrder = { critical: 0, high: 1, medium: 2, warning: 2 };
            cardObjects.sort((a, b) => (_sevOrder[a.sev] ?? 2) - (_sevOrder[b.sev] ?? 2) || b.ratio - a.ratio);
            const cards = cardObjects.map(c => c.html).join('');

            return prefix +
                `<div class="dashboard-layer${_collapsedDashLayers.has('anomaly') ? ' collapsed' : ''}" style="margin-top:12px">
                    <div class="dash-layer-header anomaly" data-layer-key="anomaly" onclick="toggleDashLayer(this)">
                        <span class="layer-icon">⚠</span>
                        ANOMALIES DETECTED
                        <span class="dash-accordion-arrow">▾</span>
                    </div>
                    <div class="anomaly-cards" style="padding:10px 12px;display:flex;flex-direction:column;gap:8px;">${cards}</div>
                </div>`;
        }

        /* ── Anomaly display helpers ───────────────────── */
        function fmtValueWithUnit(value, unit) {
            const u = (unit || '').trim();
            if (u === 'MB' && value >= 1024) return (value / 1024).toFixed(2) + ' GB';
            const numStr = Number.isInteger(value) ? value.toString() : value.toFixed(2);
            return numStr + (u ? (' ' + u) : '');
        }
        function fmtRatio(ratio) {
            return Math.min(Math.round(ratio), 99) + '\u00d7';
        }

        /* ── Anomaly cards from structured data ────────── */
        function renderAnomalyCardsHtml(anomalies) {
            if (!Array.isArray(anomalies) || anomalies.length === 0) return '';
            const sevOrder = { critical: 0, high: 1, warning: 2, medium: 2 };
            // Sort: Critical first, then High, then Warning; ties broken by ratio desc
            const sorted = [...anomalies].sort((a, b) => {
                const sa = sevOrder[a.severity || 'medium'] ?? 2;
                const sb = sevOrder[b.severity || 'medium'] ?? 2;
                if (sa !== sb) return sa - sb;
                const ra = (a.current_value || a.peak_value || 0) / (a.baseline_avg || 1);
                const rb = (b.current_value || b.peak_value || 0) / (b.baseline_avg || 1);
                return rb - ra;
            });
            const cards = sorted.map(a => {
                // current_value is the live reading; fall back to peak_value for legacy store entries
                const cv = typeof a.current_value === 'number' ? a.current_value
                         : typeof a.peak_value    === 'number' ? a.peak_value
                         : parseFloat(a.current_value || a.peak_value) || 0;
                const bv = typeof a.baseline_avg === 'number' ? a.baseline_avg : parseFloat(a.baseline_avg) || 1;
                const pv = typeof a.peak_value   === 'number' ? a.peak_value   : parseFloat(a.peak_value)   || 0;
                const ratio = bv > 0 ? cv / bv : 0;
                const sev = a.severity || (ratio > 10 ? 'critical' : ratio > 3 ? 'high' : 'medium');
                const sevStyles = {
                    critical: { border: '#c0392b', bg: '#fdecea', badge: '#c0392b', label: 'Critical' },
                    high:     { border: '#e67e22', bg: '#fef3e2', badge: '#e67e22', label: 'High'     },
                    medium:   { border: '#f0b429', bg: '#fffbea', badge: '#f0b429', label: 'Warning'  },
                    warning:  { border: '#f0b429', bg: '#fffbea', badge: '#f0b429', label: 'Warning'  },
                };
                const s        = sevStyles[sev] || sevStyles.medium;
                const unit     = String(a.unit || '').trim();
                const name     = escapeHTML(String(a.metric || 'Unknown'));
                const currStr  = fmtValueWithUnit(cv, unit);
                const baseStr  = fmtValueWithUnit(bv, unit);
                const ratioStr = bv > 0 ? fmtRatio(ratio) : '—';
                // Show session peak only if it meaningfully exceeds the current value (>10% higher)
                const peakLine = (pv > cv * 1.1 && a.current_value != null)
                    ? `<span style="color:#888">Session peak <strong>${fmtValueWithUnit(pv, unit)}</strong></span>`
                    : '';
                const pts  = a.anomalous_points || 0;
                const desc = a.description
                    ? `<div style="font-size:12px;color:#555;margin-top:6px;font-style:italic">${escapeHTML(String(a.description))}</div>`
                    : '';
                return `<div style="border-left:3px solid ${s.border};background:${s.bg};border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;">
                    <span style="font-size:18px;line-height:1.2">⚠</span>
                    <div style="flex:1;min-width:0">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
                            <strong style="color:#1a1a1a">${name}</strong>
                            <span style="font-size:11px;font-weight:600;color:#fff;background:${s.badge};border-radius:3px;padding:1px 6px">${s.label}</span>
                            <span style="font-size:12px;font-weight:700;color:${s.border}">${ratioStr} above normal</span>
                        </div>
                        <div style="font-size:13px;color:#555;display:flex;gap:16px;flex-wrap:wrap">
                            <span>Currently <strong style="color:${s.border}">${currStr}</strong></span>
                            <span>Typical avg <strong>${baseStr}</strong></span>
                            ${peakLine}
                            ${pts > 1 ? `<span style="color:#888">${pts} recent points elevated</span>` : ''}
                        </div>
                        ${desc}
                    </div>
                </div>`;
            }).join('');
            return `<div class="dashboard-layer${_collapsedDashLayers.has('anomaly') ? ' collapsed' : ''}" style="margin-top:12px">
                <div class="dash-layer-header anomaly" data-layer-key="anomaly" onclick="toggleDashLayer(this)">
                    <span class="layer-icon">⚠</span>
                    ANOMALIES DETECTED (${sorted.length})
                    <span class="dash-accordion-arrow">▾</span>
                </div>
                <div class="anomaly-cards" style="padding:10px 12px;display:flex;flex-direction:column;gap:8px;">${cards}</div>
            </div>`;
        }

        /* ── Ingestion layer tile for Doppelio stats ──── */
        function renderIngestionSection(stats) {
            if (!stats) return '';
            const isActive = !!stats.active;
            const devConn  = stats.devices_connected || 0;
            const devTotal = stats.num_devices || 0;
            const itDone   = stats.iterations_done || 0;
            const itTotal  = stats.iterations_total || 0;
            const stDone   = stats.steps_done || 0;
            const stTotal  = stats.steps_total || 0;
            const msgSent  = stats.messages_sent || 0;
            const msgRecv  = stats.messages_received || 0;

            const tiles = [
                { label: 'Devices Connected', value: `${devConn} / ${devTotal}`,

        /* ── Resource config (SKU/tier) fetched once on load ─────────────────── */
        let _resourceConfig = {};

        async function _loadResourceConfig() {
            try {
                const r = await fetch(`${API_BASE_URL}/api/resource-config`);
                if (r.ok) _resourceConfig = await r.json();
            } catch (_) { /* non-critical — falls back to static thresholds */ }
        }

        /* Returns tier-adjusted thresholds for memoryworkingset based on webapp SKU */
        function _getTierThresholds(nameKey) {
            const base = METRIC_THRESHOLDS[nameKey];
            if (!base) return base;
            // Adjust memory thresholds based on App Service plan tier
            if (nameKey === 'memoryworkingset' || nameKey === 'averagememoryworkingset') {
                const sku = (_resourceConfig.webapp_sku || '').toUpperCase();
                if (sku.startsWith('B1')) return { ...base, warn: 1300, crit: 1600 };
                if (sku.startsWith('B2')) return { ...base, warn: 2500, crit: 3200 };
                if (sku.startsWith('B3')) return { ...base, warn: 5000, crit: 6500 };
                if (sku.startsWith('S1') || sku.startsWith('S2')) return { ...base, warn: 1600, crit: 1750 };
                if (sku.startsWith('P1') || sku.startsWith('P2')) return { ...base, warn: 3500, crit: 7000 };
            }
            return base;
        }

        /* Returns { bucket, label, cssClass } for a given metric + value */
        function _getMetricBucket(nameKey, currentVal) {
            const cfg = _getTierThresholds(nameKey);
            if (!cfg || cfg.higher === 'neutral' || currentVal == null) {
                return { bucket: 'neutral', label: 'Info', cssClass: 'bucket-neutral' };
            }
            if (cfg.crit !== null && currentVal >= cfg.crit) {
                return { bucket: 'Critical', label: 'Critical', cssClass: 'bucket-critical' };
            }
            if (cfg.warn !== null && currentVal >= cfg.warn) {
                return { bucket: 'Warning', label: 'Warning', cssClass: 'bucket-warning' };
            }
            return { bucket: 'Normal', label: 'Normal', cssClass: 'bucket-normal' };
        }

        /* Returns insight sentence for a metric + bucket */
        function _getInsightText(nameKey, bucket) {
            const ins = METRIC_INSIGHTS[nameKey];
            if (!ins) return null;
            return ins[bucket] || ins['neutral'] || null;
        }

        /* Returns service name for a metric.
           Shared App Service metrics (cputime, requests, memoryworkingset …) are listed as
           'Web App' in METRIC_SERVICE_MAP, but when they arrive on the communication layer
           they belong to Function App — so we override 'Web App' with the layer default. */
        function _getServiceName(nameKey, layer) {
            const mapped = METRIC_SERVICE_MAP[nameKey];
            if (layer === 'communication') return (mapped && mapped !== 'Web App') ? mapped : 'Function App';
            if (layer === 'application')   return mapped || 'Web App';
            return mapped || '';
        }

        /* ── Chart interactivity ────────────────────────── */
        function chartHover(event, chartId) {
            const data = _chartDataStore[chartId];
            if (!data) return;
            const svg = event.currentTarget.closest('svg');
            if (!svg) return;
            const svgRect = svg.getBoundingClientRect();
            const scaleX = 420 / svgRect.width;   // viewBox width is 420
            const svgMouseX = (event.clientX - svgRect.left) * scaleX;
            const { pad, iw, t, v, unit } = data;
            const relX = svgMouseX - pad.l;
            if (relX < 0 || relX > iw || v.length < 2) return;

            const idx = Math.max(0, Math.min(v.length - 1, Math.round(relX / iw * (v.length - 1))));
            const px = pad.l + (idx / (v.length - 1)) * iw;
            const yMin = data.yMin, yRange = data.yRange, ih = data.ih;
            const val = v[idx];
            const py = (val == null) ? (pad.t + ih) : (pad.t + ih - ((val - yMin) / yRange) * ih);

            const ch = document.getElementById('ch-' + chartId);
            const dot = document.getElementById('dot-' + chartId);
            const tip = document.getElementById('tip-' + chartId);
            if (ch) { ch.setAttribute('x1', px); ch.setAttribute('x2', px); ch.setAttribute('opacity', '0.7'); }
            if (dot) { dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.setAttribute('opacity', '1'); }
            if (tip && t[idx]) {
                const d = new Date(t[idx]);
                const mo = d.toLocaleString('default', { month: 'short' });
                const ts = `${mo} ${d.getDate()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                const fv = val == null ? 'n/a' : (Math.abs(val) >= 1000 ? val.toFixed(0) : Math.abs(val) >= 1 ? val.toFixed(2) : val.toFixed(3));
                tip.textContent = `${ts} — ${fv}${unit ? ' ' + unit : ''}`;
                tip.style.display = 'block';
                // Position horizontally within chart wrap, clamped
                const wrap = document.getElementById('cw-' + chartId);
                if (wrap) {
                    const wrapRect = wrap.getBoundingClientRect();
                    let leftPx = event.clientX - wrapRect.left;
                    leftPx = Math.max(50, Math.min(leftPx, wrapRect.width - 50));
                    tip.style.left = leftPx + 'px';
                    tip.style.transform = 'translateX(-50%)';
                }
            }
        }

        function chartUnhover(chartId) {
            const ch = document.getElementById('ch-' + chartId);
            const dot = document.getElementById('dot-' + chartId);
            const tip = document.getElementById('tip-' + chartId);
            if (ch) ch.setAttribute('opacity', '0');
            if (dot) dot.setAttribute('opacity', '0');
            if (tip) tip.style.display = 'none';
        }

        function toggleSecondaryCharts(btn, layerId) {

            if (!layer) return;
            const all = Array.from(layer.querySelectorAll('.chart-secondary'));

            // "hide" mode — collapse all extras

                all.forEach(el => { el.style.display = 'none'; });
                btn.dataset.batch = '0';
                btn.dataset.mode = 'show';
                btn.textContent = 'View more';

            // "show" mode — reveal all remaining at once
            all.forEach(el => { el.style.display = 'flex'; });
            btn.dataset.mode = 'hide';
            btn.textContent = 'View less';
        }

        /* ── 3-category dashboard renderer ─────────── */
        function _renderLayerCharts(charts, layerId) {

        /* ── Cross-Session Comparison Renderer ─────────── */
        function renderSessionComparison(text) {
            // Parse header: "SESSION COMPARISON · <s1> vs <s2>"
            const hdrMatch = text.match(/SESSION COMPARISON\s*[·\u00b7]\s*(.+?)\s+vs\s+(.+?)(?:\n|$)/);
            const s1 = hdrMatch ? hdrMatch[1].trim() : 'Session 1';
            const s2 = hdrMatch ? hdrMatch[2].trim() : 'Session 2';

            // Parse metric table rows (lines that start with 2 spaces then a non-space, non-dash char)
            const tableRows = [];
            const lines = text.split('\n');
            let inTable = false, inDiffs = false;
            const diffLines = [];

            for (const line of lines) {
                const t = line.trim();
                if (!t || /^SESSION COMPARISON/i.test(t)) continue;
                if (/^KEY DIFFERENCES/i.test(t)) { inTable = false; inDiffs = true; continue; }
                if (/^[─]+$/.test(t)) { inTable = true; continue; }
                if (inDiffs) {
                    if (t.startsWith('•')) diffLines.push(t.slice(1).trim());
                    continue;
                }
                if (!inTable) continue;
                // Skip pure header row (Metric / s1 / s2 / Δ)
                if (/^Metric\b/i.test(t)) continue;
                // Split by 2+ spaces
                const parts = t.split(/\s{2,}/).map(p => p.trim()).filter(Boolean);
                if (parts.length >= 3) tableRows.push(parts);
            }

            // Delta cell coloring
            function deltaClass(d) {
                if (!d || d === '—' || d === '=') return '';
                if (d.includes('✓')) return 'pass-cell';
                if (d.includes('✗')) return 'fail-cell';
                return '';
            }

            // Build table HTML
            let tableHtml = `<table class="si-table">
                <thead><tr>
                    <th>Metric</th>
                    <th>${escapeHTML(s1.replace(/^load-/,''))}</th>
                    <th>${escapeHTML(s2.replace(/^load-/,''))}</th>
                    <th>Δ</th>
                </tr></thead><tbody>`;
            for (const [metric, v1, v2, delta = '—'] of tableRows) {
                const cls = deltaClass(delta);
                tableHtml += `<tr>
                    <td style="font-weight:600;color:#1e3a5f">${escapeHTML(metric)}</td>
                    <td>${escapeHTML(v1)}</td>
                    <td>${escapeHTML(v2)}</td>
                    <td class="${cls}">${escapeHTML(delta)}</td>
                </tr>`;
            }
            tableHtml += '</tbody></table>';

            // Key differences
            let diffsHtml = '';
            if (diffLines.length) {
                diffsHtml = `<div style="margin-top:12px;padding-top:10px;border-top:1px solid #e8edf4">
                    <div style="font-size:11px;font-weight:700;color:#6b7f99;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Key Differences</div>
                    ${diffLines.map(d => `<div style="font-size:12px;color:#333;padding:3px 0">• ${escapeHTML(d)}</div>`).join('')}
                </div>`;
            }

            return `<div class="si-card">
                <div class="si-header">
                    <span class="si-header-icon">⚖️</span>
                    <div>
                        <div class="si-header-title">Session Comparison</div>
                        <div class="si-header-session">
                            <span>${escapeHTML(s1)}</span>
                            <span style="opacity:.5;margin:0 4px">vs</span>
                            <span>${escapeHTML(s2)}</span>
                        </div>
                    </div>
                </div>
                <div class="si-section">
                    ${tableHtml}
                    ${diffsHtml}
                </div>
            </div>`;
        }

        /* ── Session Insights Renderer ─────────────────── */
        function renderSessionInsights(text) {
            const sessMatch = text.match(/SESSION INSIGHTS\s*[·\u00b7]\s*([^\n║|╗]+)/);
            const sessionName = sessMatch ? sessMatch[1].trim() : '';

            // Split by ━━━  SECTION TITLE  ━━━ delimiters
            const delimRe = /━{3}\s+([A-Z][A-Z &]+?)\s+━{2,}/g;
            const sections = [];
            let m, lastEnd = 0;
            while ((m = delimRe.exec(text)) !== null) {
                if (sections.length > 0) sections[sections.length - 1].raw = text.slice(lastEnd, m.index).trim();
                sections.push({ title: m[1].trim(), raw: '' });
                lastEnd = m.index + m[0].length;
            }
            if (sections.length > 0) {
                sections[sections.length - 1].raw = text.slice(lastEnd).replace(/^[\s━]+|[\s━]+$/g, '').trim();
            }

            const SECTION_ICONS = {
                'TEST STEP FUNNEL': '📊',
                'TOP ERRORS': '⚠️',
                'MESSAGE SEQUENCE INTEGRITY': '📨',
                'DOPPEL MODEL HEALTH': '🤖',
                'RUN COMPARISON': '📈',
                'DIRECTION BALANCE': '⚖️',
            };

            // Compute total messages for header (from step funnel if present)
            const funnelSec = sections.find(s => s.title === 'TEST STEP FUNNEL');
            let totalMsgCount = 0;
            if (funnelSec) {
                const numM = funnelSec.raw.match(/(\d[\d,]*)\s+(?:errors?|0)\s+[█░]/gi);
                // fallback: sum all numbers in funnel lines before bar
                funnelSec.raw.split('\n').filter(l => /[█░]/.test(l)).forEach(l => {
                    const noB = l.replace(/[█░]+.*$/, '').trim();
                    const cm  = noB.match(/(\d[\d,]*)\s+\d[\d,]*$/);
                    if (cm) totalMsgCount += parseInt(cm[1].replace(/,/g,''));
                });
            }

            // Sections with only an all-clear result are collapsed into a compact badge strip
            // Map each section title to a human-readable outcome message
            const ALL_CLEAR_MSG = {
                'TOP ERRORS':                  'No errors found',
                'MESSAGE SEQUENCE INTEGRITY':  'No message gaps',
            };
            const allClearTitles = [];
            const shownSections = [];
            sections.forEach(sec => {
                const body = _siSectionBody(sec.title, sec.raw);
                // All-clear: body is just a si-ok or si-empty div with no rich content
                const isAllClear = /^\s*<div class="si-ok">/.test(body) || /^\s*<div class="si-empty">/.test(body);
                // Always show funnel, model health, run comparison, direction balance
                const alwaysShow = ['TEST STEP FUNNEL','DOPPEL MODEL HEALTH','RUN COMPARISON','DIRECTION BALANCE'].includes(sec.title);
                if (isAllClear && !alwaysShow) {
                    allClearTitles.push({ icon: SECTION_ICONS[sec.title] || '📌', title: sec.title, msg: ALL_CLEAR_MSG[sec.title] || sec.title });
                } else {
                    shownSections.push({ sec, body });
                }
            });

            const clearBadges = allClearTitles.length
                ? `<div style="padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #eef2f8;background:#f9fbff">
                    <span style="font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;align-self:center;margin-right:4px">Also checked:</span>
                    ${allClearTitles.map(c =>
                        `<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;padding:4px 12px">
                            <span>${c.icon}</span>
                            <span style="font-weight:600">${escapeHTML(c.msg)}</span>
                            <span style="background:#16a34a;color:#fff;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0">✓</span>
                        </span>`
                    ).join('')}
                </div>` : '';

            let sectionsHtml = shownSections.map(({ sec, body }) => `
                <div class="si-section">
                    <div class="si-section-title">${SECTION_ICONS[sec.title] || '📌'} ${escapeHTML(sec.title)}</div>
                    <div>${body}</div>
                </div>`).join('') + clearBadges;

            return `<div class="si-card">
                <div class="si-header">
                    <span class="si-header-icon">📋</span>
                    <div>
                        <div class="si-header-title">Session Insights</div>
                        ${sessionName ? `<div class="si-header-session">${escapeHTML(sessionName)}<button class="copy-btn" onclick="copyToClip(${JSON.stringify(sessionName)},this)" title="Copy session name">⎘</button></div>` : ''}
                    </div>
                </div>
                ${sectionsHtml}
            </div>`;
        }

        function _siSectionBody(title, raw) {
            if (!raw) return '<div class="si-empty">No data.</div>';
            const t = raw.trim();
            // Empty / all-clear states — but only for sections without a dedicated rich renderer
            const hasDedicatedRenderer = ['TEST STEP FUNNEL','TOP ERRORS','DOPPEL MODEL HEALTH',
                'RUN COMPARISON','MESSAGE SEQUENCE INTEGRITY','DIRECTION BALANCE'].includes(title);
            if (!hasDedicatedRenderer) {
                if (/^No .+(found|recorded|data)/i.test(t) || /^No direction/i.test(t))
                    return `<div class="si-empty">${escapeHTML(t)}</div>`;
                if (/✓/.test(t) && t.split('\n').length <= 2)
                    return `<div class="si-ok">${escapeHTML(t.replace(/✓\s*/g,'').trim() || t)}</div>`;
            }

            if (title === 'TEST STEP FUNNEL')           return _siFunnel(raw);
            if (title === 'TOP ERRORS')                  return _siErrors(raw);
            if (title === 'DOPPEL MODEL HEALTH')         return _siModelTable(raw);
            if (title === 'RUN COMPARISON')              return _siRunTable(raw);
            if (title === 'MESSAGE SEQUENCE INTEGRITY')  return _siMsgIntegrity(raw);
            if (title === 'DIRECTION BALANCE')           return _siDirection(raw);
            return `<pre style="font-size:11px;margin:0;white-space:pre-wrap;color:#333;font-family:monospace">${escapeHTML(raw)}</pre>`;
        }

        function _siFunnel(raw) {
            const lines = raw.split('\n').filter(l => /[█░]/.test(l));
            if (!lines.length) return `<div class="si-empty">${escapeHTML(raw.trim())}</div>`;
            return lines.map(line => {
                const pctM   = line.match(/([\d.]+)%/);
                const badgeM = line.match(/(✓ PASS|⚠ WARN|✗ FAIL)/);
                if (!pctM) return '';
                const pct      = parseFloat(pctM[1]);
                const badge    = badgeM ? badgeM[1] : (pct >= 95 ? '✓ PASS' : pct >= 80 ? '⚠ WARN' : '✗ FAIL');
                const cls      = badge.includes('PASS') ? 'pass' : badge.includes('WARN') ? 'warn' : 'fail';
                // Extract step name and counts from before the bar chars: "stepName  totalMsgs  errorCount  ████..."
                const noBar    = line.replace(/[█░]+.*$/, '').trim();
                const stepName = noBar.replace(/[\d,\s]+$/, '').trim() || 'Step';
                const cntM     = noBar.match(/(\d[\d,]*)\s+(\d[\d,]*)$/);
                const totalMsgs = cntM ? parseInt(cntM[1].replace(/,/g,'')) : null;
                const errMsgs   = cntM ? parseInt(cntM[2].replace(/,/g,'')) : null;
                const countPill = totalMsgs !== null
                    ? `<span style="font-size:10.5px;color:#6b7280;margin-left:10px">${totalMsgs.toLocaleString()} msgs${errMsgs > 0 ? ` · <span style="color:#c0392b">${errMsgs} err</span>` : ''}</span>`
                    : '';
                return `<div class="si-funnel-row">
                    <div class="si-funnel-label" title="${escapeHTML(stepName)}">${escapeHTML(stepName)}</div>
                    <div class="si-funnel-bar-track"><div class="si-funnel-bar-fill ${cls}" style="width:${Math.min(pct,100).toFixed(1)}%"></div></div>
                    <div class="si-funnel-pct">${pct.toFixed(1)}%</div>
                    <div class="si-funnel-badge ${cls}">${escapeHTML(badge)}</div>
                    ${countPill}
                </div>`;
            }).join('');
        }

        function _siModelTable(raw) {
            const rows = raw.split('\n').filter(l => l.trim() && !/^[\s─]+$/.test(l.trim()));
            if (!rows.length) return '<div class="si-empty">No model data.</div>';
            const headers = ['Model','Reg','Telemetry','Coverage','Messages','Errors','Err%','Status'];
            let html = `<table class="si-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            // skip header row (contains "Model"), take data rows
            const data = rows.filter(r => !/^\s*Model\s/i.test(r));
            for (const row of data) {
                const parts = row.trim().split(/\s{2,}/);
                if (parts.length < 2) continue;
                const statusCell = parts[parts.length - 1] || '';
                const cls = statusCell.includes('PASS') ? 'pass-cell' : statusCell.includes('WARN') ? 'warn-cell' : 'fail-cell';
                html += '<tr>' + parts.map((p, i) => {
                    const cellCls = i === parts.length - 1 ? cls : '';
                    return `<td${cellCls ? ` class="${cellCls}"` : ''}>${escapeHTML(p.trim())}</td>`;
                }).join('') + '</tr>';
            }
            html += '</tbody></table>';
            return html;
        }

        function _siErrors(raw) {
            if (/^No errors/i.test(raw.trim())) return `<div class="si-ok">✓ No errors recorded</div>`;
            const rows = raw.split('\n').filter(l => l.trim() && !/^[\s─]+$/.test(l.trim()) && !/^\s*(Error|Rank)\s/i.test(l));
            if (!rows.length) return `<div class="si-empty">${escapeHTML(raw.trim())}</div>`;
            return rows.map((line, i) => {
                const p = line.trim().split(/\s{2,}/);
                if (p.length < 2) return '';
                const rank  = /^\d+$/.test(p[0]) ? p[0] : String(i + 1);
                const count = p[p.length - 2] || '';
                const errTxt = p.slice(p[0] === rank ? 1 : 0, -2).join(' ') || p[1];
                return `<div class="si-error-row">
                    <div class="si-error-rank">#${escapeHTML(rank)}</div>
                    <div class="si-error-text">${escapeHTML(errTxt)}</div>
                    <div class="si-error-count">${escapeHTML(count)}×</div>
                </div>`;
            }).join('');
        }

        function _siRunTable(raw) {
            if (/^No run/i.test(raw.trim())) return `<div class="si-empty">${escapeHTML(raw.trim())}</div>`;
            const rows = raw.split('\n').filter(l => l.trim() && !/^[\s─]+$/.test(l.trim()));
            if (!rows.length) return '<div class="si-empty">No run data.</div>';

            // Single-run format: "Single run (run_no=N) · X devices · Y msgs · Z% err · duration"
            const singleLine = rows.find(r => /single run/i.test(r));
            if (singleLine) {
                // The backend emits: "Single run (run_no=N) · Xd · Ymsgs · Z% err · Dur"
                // Map each part to a label so the user knows what each value means
                const parts = singleLine.split(/\s*·\s*/).map(p => p.trim()).filter(Boolean);
                const PILL_LABELS = ['Run', 'Devices', 'Messages', 'Error Rate', 'Duration'];
                const pills = parts.map((p, i) => {
                    const label = PILL_LABELS[i] || '';
                    const isBlank = p === '—';
                    if (isBlank && label === 'Duration') return ''; // skip blank duration
                    // Clean up jargon: "Single run (run_no=1)" → "#1"
                    const runM = p.match(/Single run\s*\(run_no=(\d+)\)/i);
                    const display = runM ? `#${runM[1]}` : escapeHTML(p);
                    return `<div style="display:inline-flex;flex-direction:column;align-items:center;background:#f0f4fa;border:1px solid #dde5f0;border-radius:8px;padding:6px 16px;margin:3px 4px;min-width:80px">
                        <span style="font-size:9.5px;color:#8899bb;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:3px">${label}</span>
                        <span style="font-size:13px;font-weight:600;color:#1e3a5f">${display}</span>
                    </div>`;
                }).filter(Boolean).join('');
                return `<div style="display:flex;flex-wrap:wrap;align-items:flex-end;padding:4px 0;gap:2px">${pills}</div>`;
            }

            let html = `<table class="si-table"><thead><tr><th>Run</th><th>Devices</th><th>Messages</th><th>Errors</th><th>Err%</th><th>Duration</th><th>vs Run-1</th></tr></thead><tbody>`;
            for (const row of rows.filter(r => !/^\s*Run\s/i.test(r))) {
                const parts = row.trim().split(/\s{2,}/);
                if (parts.length < 2) continue;
                html += '<tr>' + parts.map(p => `<td>${escapeHTML(p.trim())}</td>`).join('') + '</tr>';
            }
            html += '</tbody></table>';
            return html;
        }

        function _siMsgIntegrity(raw) {
            const t = raw.trim();
            if (t.includes('✓') || /continuous/i.test(t))
                return `<div class="si-ok">✓ ${escapeHTML(t.replace(/✓\s*/,'').trim())}</div>`;
            return `<pre style="font-size:11px;margin:0;white-space:pre-wrap;font-family:monospace;color:#333">${escapeHTML(raw)}</pre>`;
        }

        function _siDirection(raw) {
            const t = raw.trim();
            if (/^No direction/i.test(t)) return `<div class="si-empty">${escapeHTML(t)}</div>`;

            // Parse stats line: "100 devices · IN: 0 (0.0%) · OUT: 500 (100.0%) · 12 without direction (NULL)"
            const statsM = t.match(/(\d[\d,]*)\s+devices?\s*[·•]\s*IN:\s*([\d,]+)\s*\(([\d.]+)%\)\s*[·•]\s*OUT:\s*([\d,]+)\s*\(([\d.]+)%\)/i);
            const nullM  = t.match(/(\d[\d,]*)\s+without\s+direction\s*\(NULL\)/i);
            const ok     = t.includes('✓');
            const imb    = !ok && (t.includes('✗') || /missing/i.test(t));

            let html = '';

            if (statsM) {
                const devices   = statsM[1];
                const inCount   = statsM[2];
                const inPct     = parseFloat(statsM[3]);
                const outCount  = statsM[4];
                const outPct    = parseFloat(statsM[5]);
                const nullCount = nullM ? parseInt(nullM[1].replace(/,/g, '')) : 0;
                const directed  = parseInt(inCount.replace(/,/g,'')) + parseInt(outCount.replace(/,/g,''));

                // Context notes
                const inNote  = inPct  === 0 ? ' <span style="color:#e67e22;font-size:10px">(no C2D commands — normal for pure telemetry tests)</span>' : '';
                const outNote = outPct === 0 ? ' <span style="color:#e67e22;font-size:10px">(no D2C telemetry)</span>' : '';

                html += `<div style="margin-bottom:8px">
                    <table style="width:100%;border-collapse:collapse;font-size:12px">
                        <thead><tr>
                            <th style="text-align:left;padding:3px 6px;color:#6b7f99;font-size:10px;text-transform:uppercase;border-bottom:2px solid #e3eaf3">Direction</th>
                            <th style="text-align:left;padding:3px 6px;color:#6b7f99;font-size:10px;text-transform:uppercase;border-bottom:2px solid #e3eaf3">Meaning</th>
                            <th style="text-align:right;padding:3px 6px;color:#6b7f99;font-size:10px;text-transform:uppercase;border-bottom:2px solid #e3eaf3">Messages</th>
                            <th style="padding:3px 6px;border-bottom:2px solid #e3eaf3;width:120px"></th>
                            <th style="text-align:right;padding:3px 6px;color:#6b7f99;font-size:10px;text-transform:uppercase;border-bottom:2px solid #e3eaf3">%</th>
                        </tr></thead>
                        <tbody>
                            <tr>
                                <td style="padding:5px 6px;font-weight:700;color:#2980b9">OUT</td>
                                <td style="padding:5px 6px;color:#666;font-size:11px">Device → Cloud (telemetry)</td>
                                <td style="padding:5px 6px;text-align:right;font-weight:600">${outCount}${outNote}</td>
                                <td style="padding:5px 6px"><div style="background:#eef2f8;border-radius:4px;height:8px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#2980b9,#3498db);width:${outPct.toFixed(1)}%"></div></div></td>
                                <td style="padding:5px 6px;text-align:right;color:#2980b9;font-weight:700">${outPct.toFixed(1)}%</td>
                            </tr>
                            <tr>
                                <td style="padding:5px 6px;font-weight:700;color:#8e44ad">IN</td>
                                <td style="padding:5px 6px;color:#666;font-size:11px">Cloud → Device (commands)</td>
                                <td style="padding:5px 6px;text-align:right;font-weight:600">${inCount}${inNote}</td>
                                <td style="padding:5px 6px"><div style="background:#eef2f8;border-radius:4px;height:8px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#8e44ad,#9b59b6);width:${inPct.toFixed(1)}%"></div></div></td>
                                <td style="padding:5px 6px;text-align:right;color:#8e44ad;font-weight:700">${inPct.toFixed(1)}%</td>
                            </tr>
                            ${nullCount > 0 ? `<tr>
                                <td style="padding:5px 6px;font-weight:700;color:#999">NULL</td>
                                <td style="padding:5px 6px;color:#666;font-size:11px">No direction set — excluded from balance check</td>
                                <td style="padding:5px 6px;text-align:right;font-weight:600;color:#e67e22">${nullCount.toLocaleString()}</td>
                                <td style="padding:5px 6px"><div style="background:#eef2f8;border-radius:4px;height:8px;overflow:hidden"><div style="height:100%;background:#e0c58a;width:${(directed + nullCount) > 0 ? (nullCount / (directed + nullCount) * 100).toFixed(1) : 0}%"></div></div></td>
                                <td style="padding:5px 6px;text-align:right;color:#e67e22;font-weight:700">${(directed + nullCount) > 0 ? (nullCount / (directed + nullCount) * 100).toFixed(1) : 0}%</td>
                            </tr>` : ''}
                        </tbody>
                    </table>
                    <div style="font-size:10px;color:#999;margin-top:5px;padding-left:4px">
                        ${devices} devices · ${directed.toLocaleString()} messages with direction
                        ${nullCount > 0 ? `· <span style="color:#e67e22">${nullCount.toLocaleString()} messages had no direction column value (NULL) and were not included in the IN/OUT counts</span>` : '· all messages have a direction value'}
                    </div>
                </div>`;
            }

            // Balance status
            if (ok) {
                html += `<div class="si-ok">✓ All devices have the expected direction(s) — no imbalance detected</div>`;
            } else if (imb) {
                // Extract imbalanced device table if present (lines with device IDs after the status line)
                const tableLines = t.split('\n').filter(l => /^\s+\S{8,}.*\d/.test(l) && !/device.*in.*out/i.test(l));
                if (tableLines.length) {
                    html += `<div style="color:#c0392b;font-size:12px;font-weight:700;margin:6px 0 4px">✗ Devices with direction mismatch</div>`;
                    html += `<table class="si-table"><thead><tr><th>Device</th><th>IN</th><th>OUT</th><th>Issue</th></tr></thead><tbody>`;
                    for (const row of tableLines.slice(0, 20)) {
                        const p = row.trim().split(/\s{2,}/);
                        if (p.length >= 3) html += '<tr>' + p.map(c => `<td class="fail-cell">${escapeHTML(c)}</td>`).join('') + '</tr>';
                    }
                    html += '</tbody></table>';
                }
            } else {
                html += `<pre style="font-size:11px;margin:0;white-space:pre-wrap;font-family:monospace;color:#333">${escapeHTML(raw)}</pre>`;
            }
            return html;
        }

        /* ── Validation Report renderer ─────────────────── */
        function renderValidationReport(text) {
            const lines = text.split('\n');

            // Header: "Validation Report — session-name"
            const hdrM  = lines[0] && lines[0].match(/^Validation Report\s+[—–-]+\s*(.+)$/);
            const sessName = hdrM ? hdrM[1].trim() : '';

            // Overall status from last line: "  Overall: HEALTHY ✓" or "ISSUES FOUND ✗"
            const overallLine = lines.slice().reverse().find(l => /Overall:/i.test(l)) || '';
            const isHealthy   = /HEALTHY/i.test(overallLine);
            const overallTxt  = isHealthy ? 'HEALTHY' : 'ISSUES FOUND';

            // Gradient colours
            const grad   = isHealthy ? 'linear-gradient(135deg,#065f46,#059669)' : 'linear-gradient(135deg,#7f1d1d,#dc2626)';
            const accent = isHealthy ? '#059669' : '#dc2626';
            const badgeBg   = isHealthy ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.18)';
            const checkIcon = isHealthy ? '✓' : '✗';

            // Parse check rows: "  Label    value   ✓/✗"
            const CHECK_LABELS = [
                'Device Registration',
                'Telemetry Coverage',
                'Error Devices',
                'Message Uniformity',
            ];
            const CHECK_ICONS = {
                'Device Registration': '🔌',
                'Telemetry Coverage':  '📡',
                'Error Devices':       '⚠️',
                'Message Uniformity':  '📊',
            };

            const checks = [];
            for (const lbl of CHECK_LABELS) {
                const row = lines.find(l => l.trimStart().startsWith(lbl));
                if (!row) continue;
                const after   = row.trimStart().slice(lbl.length).trim();
                const pass    = after.endsWith('✓');
                const valText = after.replace(/[✓✗]$/, '').trim().replace(/\s{2,}/g, ' ');
                checks.push({ lbl, icon: CHECK_ICONS[lbl] || '•', val: valText, pass });
            }

            // Detail sections: missing devices, error device list, outliers
            const detailSections = [];
            let cur = null;
            for (const line of lines) {
                const secM = line.match(/^\s{2}(Missing Devices|Error Devices|Message Count Outliers)\s*\((\d+)\):/);
                if (secM) {
                    if (cur) detailSections.push(cur);
                    cur = { title: secM[1], count: secM[2], items: [] };
                } else if (cur && /^\s{4}[•…]/.test(line)) {
                    cur.items.push(line.trim());
                } else if (cur && /^\s{4}\S/.test(line)) {
                    cur.items.push(line.trim());
                } else if (cur && !line.trim()) {
                    detailSections.push(cur);
                    cur = null;
                }
            }
            if (cur) detailSections.push(cur);

            // Build check rows HTML
            const checksHtml = checks.map(c => {
                const passCls = c.pass
                    ? 'background:#f0fdf4;border-color:#bbf7d0'
                    : 'background:#fef2f2;border-color:#fecaca';
                const badgeStyle = c.pass
                    ? 'background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0'
                    : 'background:#fee2e2;color:#dc2626;border:1px solid #fecaca';
                return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #e5e7eb;border-radius:10px;${passCls};margin-bottom:8px">
                    <div style="font-size:18px;flex-shrink:0">${c.icon}</div>
                    <div style="flex:1;min-width:0">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280">${escapeHTML(c.lbl)}</div>
                        <div style="font-size:13px;font-weight:600;color:#1e293b;margin-top:1px">${escapeHTML(c.val)}</div>
                    </div>
                    <span style="${badgeStyle};font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;flex-shrink:0">${c.pass ? '✓ PASS' : '✗ FAIL'}</span>
                </div>`;
            }).join('');

            // Build detail sections
            const detailHtml = detailSections.map(sec => {
                const items = sec.items.map(i =>
                    `<div style="padding:3px 0;font-size:11.5px;color:#374151;border-bottom:1px solid #f3f4f6">${escapeHTML(i)}</div>`
                ).join('');
                return `<details style="margin-top:10px" open>
                    <summary style="cursor:pointer;font-size:12px;font-weight:700;color:#dc2626;padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px">
                        <span>▶</span><span>${escapeHTML(sec.title)} (${escapeHTML(sec.count)})</span>
                    </summary>
                    <div style="margin-top:6px;padding-left:6px;border-left:3px solid #fecaca">${items}</div>
                </details>`;
            }).join('');

            return `<div class="si-card">
                <div style="background:${grad};color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px">
                    <div style="background:${badgeBg};border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">
                        ${isHealthy ? '✅' : '❌'}
                    </div>
                    <div style="flex:1">
                        <div style="font-size:10.5px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.7px">Validation Report</div>
                        <div style="font-size:15px;font-weight:700;margin-top:2px">${escapeHTML(sessName)}</div>
                    </div>
                    <div style="text-align:right;flex-shrink:0">
                        <div style="font-size:18px;font-weight:800">${checkIcon}</div>
                        <div style="font-size:12px;font-weight:700;opacity:.9;margin-top:1px">${overallTxt}</div>
                    </div>
                </div>
                <div style="padding:16px 18px">
                    ${checksHtml}
                    ${detailHtml}
                </div>
            </div>`;
        }

        /* ── Raw JSON insight renderers (when LLM returns tool output directly) ── */

        function renderInsightJson(data) {
            if (Array.isArray(data.steps))        return _renderFunnelJson(data);
            if (Array.isArray(data.top_errors))   return _renderErrorsJson(data);
            if (Array.isArray(data.gap_devices))  return _renderGapsJson(data);
            if (Array.isArray(data.models))       return _renderModelHealthJson(data);
            if (Array.isArray(data.runs))         return _renderRunComparisonJson(data);
            if ('inbound_total' in data)          return _renderDirectionJson(data);
            return `<pre style="font-size:12px;font-family:monospace;padding:12px;background:#f8f9fa;border-radius:8px;overflow-x:auto;white-space:pre-wrap">${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
        }

        function _insightCardWrap(sess, subtitle, label, bodyHtml, footerHtml) {
            // Individual insight cards use a teal gradient to distinguish from
            // the full Session Insights combined report (which uses dark blue)
            return `<div class="si-card">
                <div style="background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px">
                    <div style="background:rgba(255,255,255,.18);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">📊</div>
                    <div>
                        <span style="font-size:10.5px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.7px">${label}</span>
                        <div style="font-size:14px;font-weight:700;margin-top:1px">${escapeHtml(sess)}</div>
                        ${subtitle ? `<div style="font-size:11px;opacity:.8;margin-top:2px">${subtitle}</div>` : ''}
                    </div>
                </div>
                <div class="si-section">${bodyHtml}</div>
                ${footerHtml}
            </div>`;
        }

        function _renderFunnelJson(data) {
            const sess   = data.test_session_name || '';
            const steps  = data.steps || [];
            const total  = steps.reduce((s, st) => s + st.total, 0);
            const errs   = steps.reduce((s, st) => s + st.error_count, 0);
            const allOk  = errs === 0;

            const body = steps.map(st => {
                const pct = st.success_pct;
                const cls = pct >= 95 ? 'pass' : pct >= 80 ? 'warn' : 'fail';
                const badge = pct >= 95 ? '✓ PASS' : pct >= 80 ? '⚠ WARN' : '✗ FAIL';
                return `<div class="si-funnel-row">
                    <span style="min-width:140px;font-size:12px;font-weight:600;color:#1e3a5f;text-transform:uppercase">${escapeHtml(st.test_step)}</span>
                    <div class="si-funnel-bar"><div class="si-funnel-bar-fill ${cls}" style="width:${pct}%"></div></div>
                    <span style="font-size:12px;font-weight:700;color:#1e3a5f;min-width:46px;text-align:right">${pct.toFixed(1)}%</span>
                    <span class="si-badge ${cls}">${badge}</span>
                    <span style="font-size:11px;color:#6b7280;margin-left:10px">${st.total.toLocaleString()} msgs&ensp;·&ensp;${st.error_count} err</span>
                </div>`;
            }).join('');

            const footer = allOk
                ? `<div style="padding:10px 18px;background:#f0fdf4;border-top:1px solid #bbf7d0;font-size:11.5px;color:#15803d">✓ All steps show 100% success and no errors for this session.</div>`
                : `<div style="padding:10px 18px;background:#fef3c7;border-top:1px solid #fde68a;font-size:11.5px;color:#92400e">⚠ ${errs.toLocaleString()} total errors across ${steps.length} step(s).</div>`;

            return _insightCardWrap(sess, `${total.toLocaleString()} total messages · ${steps.length} step(s)`, 'Step Funnel', body, footer);
        }

        function _renderErrorsJson(data) {
            const sess   = data.test_session_name || '';
            const errors = data.top_errors || [];
            const total  = data.total_error_events || 0;
            const devs   = data.total_affected_devices || 0;
            if (!errors.length) {
                return _insightCardWrap(sess, '', 'Top Errors',
                    '<div class="si-ok">✓ No errors recorded for this session.</div>', '');
            }
            const rows = errors.map(e => `<tr>
                <td style="color:#6b7280;text-align:center">${e.rank}</td>
                <td style="font-weight:600;color:#c0392b">${escapeHtml(e.error || '—')}</td>
                <td>${escapeHtml(e.test_step || '—')}</td>
                <td style="text-align:right;font-weight:600">${(e.occurrences||0).toLocaleString()}</td>
                <td style="text-align:right">${e.affected_devices||0}</td>
            </tr>`).join('');
            const body = `<div style="font-size:11.5px;color:#555;margin-bottom:10px">${total.toLocaleString()} total error events · ${devs} affected devices</div>
                <table class="si-table"><thead><tr><th>#</th><th>Error</th><th>Step</th><th>Count</th><th>Devices</th></tr></thead><tbody>${rows}</tbody></table>`;
            return _insightCardWrap(sess, '', 'Top Errors', body, '');
        }

        function _renderGapsJson(data) {
            const sess  = data.test_session_name || '';
            const gaps  = data.gap_devices || [];
            const n     = data.devices_with_gaps || 0;
            const total = data.total_gaps || 0;
            if (!gaps.length) {
                return _insightCardWrap(sess, '', 'Message Sequence Integrity',
                    '<div class="si-ok">✓ All devices have continuous msg_no sequences — no gaps detected.</div>', '');
            }
            const rows = gaps.map(g => `<tr>
                <td style="font-family:monospace;font-size:11px">${escapeHtml(g.device_id)}</td>
                <td style="text-align:right">${(g.received||0).toLocaleString()}</td>
                <td style="text-align:right">${(g.expected||0).toLocaleString()}</td>
                <td style="text-align:right;color:#c0392b;font-weight:700">${(g.gap_count||0).toLocaleString()}</td>
            </tr>`).join('');
            const body = `<div style="font-size:11.5px;color:#c0392b;margin-bottom:10px;font-weight:600">✗ ${n} device(s) with gaps · ${total.toLocaleString()} total missing messages</div>
                <table class="si-table"><thead><tr><th>Device</th><th>Received</th><th>Expected</th><th>Gaps</th></tr></thead><tbody>${rows}</tbody></table>`;
            return _insightCardWrap(sess, '', 'Message Sequence Integrity', body, '');
        }

        function _renderModelHealthJson(data) {
            const sess   = data.test_session_name || '';
            const models = data.models || [];
            if (!models.length) {
                return _insightCardWrap(sess, '', 'Doppel Model Health',
                    '<div class="si-empty">No model data — LoadTestDevices may be empty for this session.</div>', '');
            }
            const rows = models.map(m => {
                const cls = m.coverage_pct >= 95 ? 'pass' : m.coverage_pct >= 80 ? 'warn' : 'fail';
                return `<tr>
                    <td style="font-weight:600">${escapeHtml(m.doppel_model||'—')}</td>
                    <td style="text-align:right">${m.registered||0}</td>
                    <td style="text-align:right">${m.with_telemetry||0}</td>
                    <td style="text-align:right;font-weight:600">${(m.coverage_pct||0).toFixed(1)}%</td>
                    <td style="text-align:right">${(m.total_msgs||0).toLocaleString()}</td>
                    <td style="text-align:right;color:#c0392b">${(m.total_errors||0).toLocaleString()}</td>
                    <td style="text-align:right">${(m.error_rate_pct||0).toFixed(2)}%</td>
                    <td><span class="si-badge ${cls}">${m.coverage_pct>=95?'✓ PASS':m.coverage_pct>=80?'⚠ WARN':'✗ FAIL'}</span></td>
                </tr>`;
            }).join('');
            const body = `<table class="si-table"><thead><tr><th>Model</th><th>Reg</th><th>Telemetry</th><th>Coverage</th><th>Messages</th><th>Errors</th><th>Err%</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
            return _insightCardWrap(sess, `${models.length} model(s)`, 'Doppel Model Health', body, '');
        }

        function _renderRunComparisonJson(data) {
            const sess = data.test_session_name || '';
            const runs = data.runs || [];
            if (!runs.length) {
                return _insightCardWrap(sess, '', 'Run Comparison', '<div class="si-empty">No run data found.</div>', '');
            }
            const base = runs[0];
            const rows = runs.map(r => {
                const isBase = r.test_session_run_no === base.test_session_run_no;
                const errPct = (r.error_rate_pct||0).toFixed(2);
                const delta  = isBase ? '<span style="color:#6b7280;font-size:11px">← baseline</span>'
                    : (() => {
                        const d = (r.error_rate_pct||0) - (base.error_rate_pct||0);
                        const sign = d > 0 ? '↑' : '↓';
                        const col  = d > 0 ? '#c0392b' : '#27ae60';
                        return `<span style="color:${col};font-weight:700">${sign}${Math.abs(d).toFixed(2)}%</span>`;
                    })();
                const durS = r.duration_sec;
                const dur  = durS != null ? (durS >= 60 ? `${Math.floor(durS/60)}m ${durS%60}s` : `${durS}s`) : '—';
                return `<tr>
                    <td style="text-align:center;font-weight:700">${r.test_session_run_no||'—'}</td>
                    <td style="text-align:right">${(r.device_count||0).toLocaleString()}</td>
                    <td style="text-align:right">${(r.total_msgs||0).toLocaleString()}</td>
                    <td style="text-align:right;color:#c0392b">${(r.error_count||0).toLocaleString()}</td>
                    <td style="text-align:right">${errPct}%</td>
                    <td style="text-align:right">${dur}</td>
                    <td>${delta}</td>
                </tr>`;
            }).join('');
            const body = `<table class="si-table"><thead><tr><th>Run</th><th>Devices</th><th>Messages</th><th>Errors</th><th>Err%</th><th>Duration</th><th>vs Run-1</th></tr></thead><tbody>${rows}</tbody></table>`;
            return _insightCardWrap(sess, `${runs.length} run(s)`, 'Run Comparison', body, '');
        }

        function _renderDirectionJson(data) {
            const sess = data.test_session_name || '';
            // reuse existing text renderer by delegating to _siDirection
            // build a minimal formatted string that _siDirection can parse
            const inb  = data.inbound_total  || 0;
            const outb = data.outbound_total || 0;
            const total = inb + outb;
            const inPct  = total ? (inb  / total * 100).toFixed(1) : '0.0';
            const outPct = total ? (outb / total * 100).toFixed(1) : '0.0';
            const nullN  = data.null_direction_count || 0;
            const devs   = data.total_devices || 0;
            const imb    = data.imbalanced_count || 0;
            const nullNote = nullN ? `  ·  ${nullN.toLocaleString()} without direction (NULL)` : '';
            const statusLine = imb === 0
                ? `  All devices have the expected direction(s)   ✓`
                : `  ${imb} device(s) missing an expected direction   ✗`;
            const fakeText = `${devs} devices  ·  IN: ${inb} (${inPct}%)  ·  OUT: ${outb} (${outPct}%)${nullNote}\n${statusLine}`;
            const body = _siDirection(fakeText);
            return _insightCardWrap(sess, `${devs.toLocaleString()} device(s)`, 'Direction Balance', body, '');
        }

        /* ── Route text to the right renderer ─────────── */
        function formatResponse(text) {
            // Replace [UPLOAD_CSV] marker with an inline upload button
            text = text.replace('[UPLOAD_CSV]',
                '<button class="inline-upload-btn" onclick="document.getElementById(\'csvFileInput\').click()">&#128206; Upload CSV</button>');

            // Raw JSON from individual insight tool calls (LLM sometimes passes through dict directly)
            const _trimmed = text.trim();
            if (_trimmed.startsWith('{') && _trimmed.endsWith('}')) {
                try {
                    const _j = JSON.parse(_trimmed);
                    if (_j.test_session_name && _j.status === 'ok') return renderInsightJson(_j);
                } catch (_e) { /* not valid JSON, fall through */ }
            }

            // Cross-session comparison report
            if (/SESSION COMPARISON\s*[·\u00b7]/.test(text)) {
                return renderSessionComparison(text);
            }

            // Session insights report → styled insights card (must check before ═{10,} match)
            if (text.includes('SESSION INSIGHTS') && /━{3}\s+[A-Z]/.test(text)) {
                return renderSessionInsights(text);
            }

            // Validation report → styled check-list card (must check before ─{10,} match)
            if (/^Validation Report\s+[—–-]/.test(text.trim())) {
                return renderValidationReport(text);
            }

            // Structured metric separators → performance card
            if (/={20,}|─{10,}|═{10,}/.test(text)) {
                return formatPerformanceMetrics(text);
            }
