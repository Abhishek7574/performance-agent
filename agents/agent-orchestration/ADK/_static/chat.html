            // Anomaly section → styled anomaly cards (must check before heading path)
            if (text.includes('### ⚠ Anomalies Detected')) {
                return renderAnomalySection(text);
            }

            // Has markdown headings, code fences, or pipe tables → full markdown
            const hasHeadings   = /^#{1,3}\s+\S/m.test(text);
            const hasCodeFences = /```/.test(text);
            const hasPipeTables = /^\|.+\|/m.test(text);

            if (hasHeadings || hasCodeFences || hasPipeTables) {
                return renderFullMarkdown(text);
            }

            // Numbered sections → rich sectioned card
            if (/^\d+[.)]\s+\S/m.test(text)) {
                return formatSectionedResponse(text);
            }

            // Load-test result card (matches orchestrator summary output)
            if (/^Load test (running|error|completed|failed)/i.test(text.trim())) {
                return formatLoadTestResult(text);
            }

            return formatPlainNarrative(text);
        }

        /* ── Load-test result card ─────────────────────── */
        function formatLoadTestResult(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const title = lines[0] || 'Load test running.';
            const kv = {};
            for (const l of lines.slice(1)) {
                const m = l.match(/^[•\-*]\s+([^:]+?)\s*:\s*(.+)$/);
                if (m) kv[m[1].trim().toLowerCase().replace(/\s+/g, '_')] = m[2].trim();
            }
            const devices  = kv['devices']  || '—';
            const duration = kv['duration'] || '—';
            const session  = (kv['session'] || '—').toUpperCase();
            const rawRunNo = kv['run_no']   || kv['run no'] || '—';
            const status   = kv['status']   || 'Running';

            // "1 / 1" → "1"
            const runNoDisplay = rawRunNo.replace(/\s*\/.*$/, '').trim();

            // Parse duration: "3 min" → num="3", unit="min"
            const durM = duration.match(/^(\d[\d.]*)\s*(.*)$/);
            const durNum  = durM ? durM[1] : duration;
            const durUnit = durM ? (durM[2] || '').trim() : '';

            const isRunning = /running|starting/i.test(status);
            
            // Determine badge class based on running state and status
            let badgeCls;
            if (isRunning) {
                badgeCls = 'running';
            } else if (/error|fail/i.test(status)) {
                badgeCls = 'error';
            } else {
                badgeCls = 'completed';
            }

            return `<div class="lt-result-card">
                <div class="lt-result-header">
                    <span class="lt-result-title">${escapeHTML(title)}</span>
                    <span class="lt-badge ${badgeCls}">● ${escapeHTML(status.toUpperCase())}</span>
                </div>
                <div class="lt-result-main-grid">
                    <div class="lt-result-tile">
                        <span class="lt-result-label">Devices</span>
                        <span class="lt-result-big">${escapeHTML(devices)}</span>
                    </div>
                    <div class="lt-result-tile">
                        <span class="lt-result-label">Duration</span>
                        <span class="lt-result-big">${escapeHTML(durNum)}<span class="lt-result-big-unit">${escapeHTML(durUnit)}</span></span>
                    </div>
                </div>
                <div class="lt-result-session-row">
                    <div class="lt-result-session-info">
                        <span class="lt-result-label">Session</span>
                        <span class="lt-result-session-id">${escapeHTML(session)}</span>
                    </div>
                    <div class="lt-result-run-tile">
                        <span class="lt-result-label">Run No</span>
                        <span class="lt-result-big">${escapeHTML(runNoDisplay)}</span>
                    </div>
                </div>
            </div>`;
        }

        function parseBulletSegments(rawLines) {
            const introLines = [];
            const bullets    = [];
            const trailLines = [];
            let inBullets  = false;

            for (const line of rawLines) {
                const t = line.trim();
                const isBullet = /^[•\-*]\s/.test(t);
                if (isBullet) {
                    inBullets = true;
                    bullets.push(t.replace(/^[•\-*]\s*/, ''));
                } else if (inBullets) {
                    if (t) trailLines.push(t);
                } else if (t) {
                    introLines.push(t);
                }
            }
            return { introLines, bullets, trailLines };
        }

        function categorizeBullets(bullets) {
            const svcBullets    = [];
            const metricBullets = [];
            const textKvBullets = [];
            const plainBullets  = [];

            for (const b of bullets) {
                const kvM = b.match(/^([^:]{1,55}):\s+(.+)$/);
                if (kvM) {
                    const key = kvM[1].trim();
                    const val = kvM[2].trim();
                    const isService = /^(Web App|Function App|Event Hub|Database|App Service|AKS|Storage|Redis|API|Container|Service Bus|Cosmos|SQL Server|Virtual Machine|VM)\b/i.test(key);
                    if (isService) {
                        svcBullets.push({ key, val });
                    } else {
                        const numM = val.match(/^(?:about |~)?(\d[\d.,]*)\s*(MB|GB|KB|TB|%|ms|s|req|rpm|rps)?/i);
                        if (numM) {
                            metricBullets.push({ key, val, num: numM[1], unit: numM[2] || '' });
                        } else if (val.length <= 25 && !/[.;]\s|[\u2014\u2013]/.test(val)) {
                            metricBullets.push({ key, val, num: val, unit: '' });
                        } else {
                            textKvBullets.push({ key, val });
                        }
                    }
                } else {
                    plainBullets.push(b);
                }
            }
            return { svcBullets, metricBullets, textKvBullets, plainBullets };
        }

        function summaryTone(text) {
            if (/error|fail|critical|warning|alert/i.test(text)) return 'warn';
            if (/idle|healthy|stable|fine|good|up|no issue|no error|no performance|no signs|no load|very stable/i.test(text)) return 'ok';
            return 'info';
        }

        /* plain fallback ─────────────────────────────── */
        function renderNarrativeLines(rawLines) {
            let html = '<div class="narrative-wrap">';
            rawLines.forEach(line => {
                const t = line.trim();
                if (!t) { html += '<br>'; return; }
                html += `<p>${formatMarkdown(t)}</p>`;
            });
            html += '</div>';
            return html;
        }

        function renderMetricTile(m) {
            const vc = valueClass(m.val);
            const isNumeric = /^[\d.,]+$/.test(String(m.num));
            return `<div class="pn-metric-tile"><div class="pn-metric-label">${m.key}</div><div class="pn-metric-value ${vc}${isNumeric ? '' : ' text'}">${m.num}<span class="pn-metric-unit">${m.unit ? ' ' + m.unit : ''}</span></div></div>`;
        }

        function renderBulletSections(introLines, svcBullets, metricBullets, textKvBullets, plainBullets, trailLines) {
            let html = '<div class="pn-container">';
            if (introLines.length) {
                html += `<div class="pn-intro">${formatMarkdown(introLines.join(' '))}</div>`;
            }
            if (svcBullets.length) {
                html += '<div class="svc-cards-wrap">';
                for (const s of svcBullets) { html += renderServiceCard(s.key, s.val); }
                html += '</div>';
            }
            if (metricBullets.length) {
                html += '<div class="pn-metric-grid">';
                for (const m of metricBullets) { html += renderMetricTile(m); }
                html += '</div>';
            }
            if (textKvBullets.length) {
                html += '<div class="r-kv-table pn-kv-pad">';
                for (const kv of textKvBullets) {
                    const vc = valueClass(kv.val);
                    html += `<div class="r-kv-row"><span class="r-kv-k">${formatMarkdown(kv.key)}</span><span class="r-kv-v ${vc}">${formatMarkdown(kv.val)}</span></div>`;
                }
                html += '</div>';
            }
            if (plainBullets.length) {
                html += '<div class="r-bullet-list pn-bullet-pad">';
                for (const b of plainBullets) {
                    html += `<div class="r-bullet"><span class="r-bullet-dot">•</span><span>${formatMarkdown(b)}</span></div>`;
                }
                html += '</div>';
            }
            if (trailLines.length) {
                const sumText  = trailLines.join(' ');
                const cleanSum = sumText.replace(/^(Overall|In summary|In simple terms|Note|Summary)\s*:\s*/i, '');
                html += `<div class="summary-box ${summaryTone(sumText)}">${formatMarkdown(cleanSum)}</div>`;
            }
            html += '</div>';
            return html;
        }

        function formatPlainNarrative(text) {
            const rawLines = text.split('\n');
            const { introLines, bullets, trailLines } = parseBulletSegments(rawLines);
            if (bullets.length === 0) return renderNarrativeLines(rawLines);
            const { svcBullets, metricBullets, textKvBullets, plainBullets } = categorizeBullets(bullets);
            return renderBulletSections(introLines, svcBullets, metricBullets, textKvBullets, plainBullets, trailLines);
        }

        function parseSections(rawLines) {
            const intro = [];
            const sections = [];
            let cur = null;

            for (const line of rawLines) {
                const numM = line.match(/^(\d+)[.)]\s+(.+)$/);
                if (numM) {
                    if (cur) sections.push(cur);
                    cur = { num: numM[1], title: numM[2].trim(), lines: [] };
                } else if (cur) {
                    cur.lines.push(line);
                } else {
                    intro.push(line);
                }
            }
            if (cur) sections.push(cur);
            return { intro, sections };
        }

        /* sectioned response ─────────────────────────── */
        function formatSectionedResponse(text) {
            const rawLines = text.split('\n');
            const { intro, sections } = parseSections(rawLines);

            let summaryText = '';
            if (sections.length > 0) {
                const last = sections[sections.length - 1];
                const sumIdx = last.lines.findIndex(l => /^summary:?$/i.test(l.trim()));
                if (sumIdx >= 0) {
                    summaryText = last.lines.slice(sumIdx + 1).map(l => l.trim()).filter(Boolean).join(' ');
                    last.lines = last.lines.slice(0, sumIdx);
                }
            }
            if (sections.length > 0) {
                const last = sections[sections.length - 1];
                if (/^(summary|in summary)$/i.test(last.title)) {
                    summaryText = last.lines.map(l => l.trim()).filter(Boolean).join(' ');
                    sections.pop();
                }
            }

            let html = '<div class="response-container">';
            const introText = intro.join('\n').trim();
            if (introText) {
                html += `<div class="response-intro">${formatMarkdown(introText)}</div>`;
            }
            for (const sec of sections) {
                html += renderRichSection(sec);
            }
            if (summaryText) {
                let tone;
                if (/error|fail|critical|warning|alert/i.test(summaryText)) {
                    tone = 'warn';
                } else if (/idle|no load|healthy|fine|good|plenty|normal/i.test(summaryText)) {
                    tone = 'ok';
                } else {
                    tone = 'info';
                }
                html += `<div class="summary-box ${tone}"><strong>Summary:</strong> ${formatMarkdown(summaryText)}</div>`;
            }
            html += '</div>';
            return html;
        }

        function buildSvcChipHtml(si) {
            const fullText = si.type === 'bullet-kv' ? `${si.key}: ${si.value}` : si.text;
            const colon   = fullText.indexOf(':');
            const svcType = colon >= 0 ? fullText.slice(0, colon).trim() : fullText;
            const svcName = colon >= 0 ? fullText.slice(colon + 1).trim() : '';
            const cls     = /offline|down|error|fail|unavail/i.test(fullText) ? 'err' : 'ok';
            const label   = svcName ? `${svcType}: <strong>${svcName}</strong>` : svcType;
            return `<span class="svc-chip ${cls}"><span class="svc-dot-led ${cls}"></span>${label}</span>`;
        }

        function renderSvcChips(items) {
            const svcItems = items.filter(it =>
                (it.type === 'bullet' || it.type === 'bullet-kv') &&
                /^(Web App|Function App|Event Hub|Database|App Service|Container|AKS|Service):/i
                    .test(it.type === 'bullet-kv' ? (it.key + ':') : it.text));
            const restItems = svcItems.length ? items.filter(it => !svcItems.includes(it)) : items;
            let chipsHtml = '';
            if (svcItems.length > 0) {
                chipsHtml += '<div class="svc-chips-row">';
                for (const si of svcItems) {
                    chipsHtml += buildSvcChipHtml(si);
                }
                chipsHtml += '</div>';
            }
            return { chipsHtml, restItems };
        }

        function renderRichSection(sec) {
            const { num, title, lines } = sec;
            const items = parseLineItems(lines);

            const isHealthSec = /health|service|status|availab/i.test(title);
            const { chipsHtml, restItems } = isHealthSec
                ? renderSvcChips(items)
                : { chipsHtml: '', restItems: items };

            const bodyHtml = chipsHtml + renderItems(restItems);

            return `<div class="resp-section">
                <div class="resp-sec-head">
                    <span class="sec-badge">${num}</span>
                    <span class="sec-title">${formatMarkdown(title)}</span>
                </div>
                <div class="resp-sec-body">${bodyHtml}</div>
            </div>`;
        }

        function parseBulletItem(content) {
            if (content.endsWith(':') && content.length < 50) {
                return { type: 'bullet-subhdr', text: content.slice(0, -1) };
            }
            const kvM = content.match(/^([A-Za-z][A-Za-z0-9\s/()-]{1,38}):\s+(.+)$/);
            if (kvM) {
                return { type: 'bullet-kv', key: kvM[1].trim(), value: kvM[2].trim() };
            }
            return { type: 'bullet', text: content };
        }

        function parseLineItems(lines) {
            const items = [];
            for (const line of lines) {
                const t = line.trim();
                if (!t) continue;
                if (/^[•\-*]\s/.test(t)) {
                    const content = t.replace(/^[•\-*]\s*/, '');
                    items.push(parseBulletItem(content));
                } else if (t.endsWith(':') && t.length < 50) {
                    items.push({ type: 'subhdr', text: t.slice(0, -1) });
                } else if (t.includes(':')) {
                    const ci = t.indexOf(':');
                    const k  = t.slice(0, ci).trim();
                    const v  = t.slice(ci + 1).trim();
                    if (k.length < 50 && v.length > 0) {
                        items.push({ type: 'kv', key: k, value: v });
                    } else {
                        items.push({ type: 'text', text: t });
                    }
                } else {
                    items.push({ type: 'text', text: t });
                }
            }
            return items;
        }

        function valueClass(val) {
            if (/normal|fine|healthy|online|running|instant|idle|ok|good|light|zero|none|no error|no issue/i.test(val)) return 'ok';
            if (/error|fail|critical|down|offline|issue|unavail/i.test(val)) return 'err';
            if (/warning|caution|slow|high|elevated/i.test(val)) return 'warn';
            return '';
        }

        function renderItems(items) {
            let html = '';
            let bullets = [];
            let kvBuf   = [];

            function flushBullets() {
                if (!bullets.length) return;
                html += '<div class="r-bullet-list">';
                for (const b of bullets) {
                    if (b.type === 'bullet') {
                        html += `<div class="r-bullet"><span class="r-bullet-dot">•</span><span>${formatMarkdown(b.text)}</span></div>`;
                    } else if (b.type === 'bullet-subhdr') {
                        html += `<div class="r-bullet-subhdr">${formatMarkdown(b.text)}</div>`;
                    } else if (b.type === 'bullet-kv') {
                        const vc = valueClass(b.value);
                        html += `<div class="r-bullet-kv">
                            <span class="r-bkv-k">${formatMarkdown(b.key)}</span>
                            <span class="r-bkv-v ${vc}">${formatMarkdown(b.value)}</span>
                        </div>`;
                    }
                }
                html += '</div>';
                bullets = [];
            }

            function flushKv() {
                if (!kvBuf.length) return;
                html += '<div class="r-kv-table">';
                for (const kv of kvBuf) {
                    const vc = valueClass(kv.value);
                    html += `<div class="r-kv-row">
                        <span class="r-kv-k">${formatMarkdown(kv.key)}</span>
                        <span class="r-kv-v ${vc}">${formatMarkdown(kv.value)}</span>
                    </div>`;
                }
                html += '</div>';
                kvBuf = [];
            }

            for (const item of items) {
                if (item.type === 'bullet' || item.type === 'bullet-kv' || item.type === 'bullet-subhdr') {
                    flushKv();
                    bullets.push(item);
                } else if (item.type === 'kv') {
                    flushBullets();
                    kvBuf.push(item);
                } else if (item.type === 'subhdr') {
                    flushBullets(); flushKv();
                    html += `<div class="r-subheader">${formatMarkdown(item.text)}</div>`;
                } else {
                    flushBullets(); flushKv();
                    html += `<div class="r-text-line">${formatMarkdown(item.text)}</div>`;
                }
            }
            flushBullets();
            flushKv();
            return html;
        }

        /* ── Percentage helpers ────────────────────────── */
        function parsePct(val) {
            const m = String(val).match(/([\d.]+)/);
            return m ? Number.parseFloat(m[1]) : null;
        }

        function cardLevel(pct) {
            if (pct === null) return 'good';
            if (pct >= 90)   return 'critical';
            if (pct >= 70)   return 'warning';
            return 'good';
        }

        function levelLabel(pct) {
            if (pct === null) return '';
            if (pct >= 90)   return 'Critical';
            if (pct >= 70)   return 'Warning';
            return 'Normal';
        }

        /* ── Extract structured data ───────────────────── */
        function extractSystemMetrics(text) {
            const patterns = [
                { key: 'cpu',    label: 'CPU',    icon: '🖥️',  re: /CPU\s*(?:Usage)?\s*[:|]\s*([\d.]+%?)/i },
                { key: 'memory', label: 'Memory', icon: '🧠',  re: /Memory\s*(?:Usage)?\s*[:|]\s*([\d.]+%?)/i },
                { key: 'disk',   label: 'Disk',   icon: '💾',  re: /Disk\s*(?:Usage)?\s*[:|]\s*([\d.]+%?)/i },
            ];
            const res = {};
            patterns.forEach(p => {
                const m = text.match(p.re);
                if (m) res[p.key] = { label: p.label, icon: p.icon, value: m[1].trim() };
            });
            const memAvail = text.match(/(?:available|free)\s*[:|]\s*([\d.]+\s*GB)/i);
            if (memAvail && res.memory) res.memory.sub = memAvail[1] + ' available';
            const diskFree = text.match(/(?:free|available)\s*[:|]\s*([\d.]+\s*GB)/i);
            if (diskFree && res.disk) res.disk.sub = diskFree[1] + ' free';
            return Object.keys(res).length >= 2 ? res : null;
        }

        function extractHealthLines(lines) {
            const svcs = [];
            lines.forEach(line => {
                const on  = line.match(/✅\s*(.+?)\s*[|｜]\s*(Online|Healthy|Running|online|healthy)/i);
                const off = line.match(/❌\s*(.+?)\s*[|｜]\s*(.+)/i);
                if (on)       svcs.push({ name: on[1].trim(),  state: on[2].trim(),             online: true  });
                else if (off) svcs.push({ name: off[1].trim(), state: off[2].trim().slice(0,30), online: false });
            });
            return svcs.length ? svcs : null;
        }

        function extractProcessLines(lines) {
            const procs = [];
            lines.forEach(line => {
                const lineM = line.match(/^\s*\d+[.)]\s+(.+)/);
                if (!lineM || !/[|｜]/.test(lineM[1])) return;
                const rest = lineM[1];
                const name = rest.split(/\s*[|｜]/)[0].trim().split(/\s+/).slice(0, 2).join(' ');
                const cpuM = rest.match(/CPU:\s*([\d.]+%?)/i);
                const memM = rest.match(/(?:MEM|Memory):\s*([\d.]+%?)/i);
                procs.push({ name, cpu: cpuM ? cpuM[1] : null, mem: memM ? memM[1] : null });
            });
            return procs.length ? procs : null;
        }

        /* ── Build card HTML fragments ─────────────────── */
        function buildMetricGrid(metrics) {
            let html = '<div class="metrics-grid">';
            for (const [, m] of Object.entries(metrics)) {
                const p    = parsePct(m.value);
                const lvl  = cardLevel(p);
                const pctW = p === null ? 0 : Math.min(p, 100);
                html += `
                <div class="metric-card ${lvl === 'good' ? '' : lvl}">
                  <div class="metric-card-top">
                    <span class="metric-card-icon">${m.icon}</span>
                    ${p === null ? '' : `<span class="metric-badge ${lvl}">${levelLabel(p)}</span>`}
                  </div>
                  <div class="metric-card-label">${m.label}</div>
                  <div class="metric-card-value ${p === null ? '' : lvl}">${m.value}</div>
                  ${m.sub ? `<div class="metric-card-sub">${m.sub}</div>` : ''}
                  ${p === null ? '' : `<div class="metric-prog-bar"><div class="metric-prog-fill ${lvl}" style="width:${pctW}%"></div></div>`}
                </div>`;
            }
            html += '</div>';
            return html;
        }

        function buildStatusGrid(svcs) {
            let html = '<div class="status-grid">';
            svcs.forEach(s => {
                const cls = s.online ? 'online' : 'offline';
                html += `
                <div class="status-card ${cls}">
                  <div class="status-dot ${cls}"></div>
                  <div>
                    <div class="status-card-name">${s.name}</div>
                    <div class="status-card-state">${s.state}</div>
                  </div>
                </div>`;
            });
            html += '</div>';
            return html;
        }

        function buildProcessList(procs) {
            let html = '<div class="process-list">';
            procs.slice(0, 8).forEach((p, i) => {
                const stats = [p.cpu ? `CPU ${p.cpu}` : null, p.mem ? `MEM ${p.mem}` : null].filter(Boolean).join(' · ');
                html += `
                <div class="process-card">
                  <span class="process-rank">${i+1}</span>
                  <span class="process-name">${p.name}</span>
                  ${stats ? `<span class="process-stat">${stats}</span>` : ''}
                </div>`;
            });
            html += '</div>';
            return html;
        }

        function findSubtitleAfter(lines, titleText) {
            let hit = false;
            for (const l2 of lines) {
                if (l2.trim() === titleText) { hit = true; continue; }
                if (!hit) continue;
                const s = l2.trim();
                if (s && !/^[─═=-]{5,}$/.test(s)) return s;
            }
            return '';
        }

        function findTitleSubtitle(lines) {
            let title = '', subtitle = '';
            for (const line of lines) {
                const t = line.trim();
                if (!t || /^[─═=-]{5,}$/.test(t)) continue;
                if (/[A-Z]{4,}/.test(t) || /^[📊🖥🏥🎛📈🎯⚡🏗☁]/u.test(t)) {
                    title = t;
                    subtitle = findSubtitleAfter(lines, title);
                    break;
                }
            }
            return { title, subtitle };
        }

        function buildKvSection(lines, skipLine, title) {
            let kvHtml = '';
            let lastSection = '';

            lines.forEach(line => {
                if (skipLine(line)) return;
                const t = line.trim();

                if ((/^\[.+\]$/.test(t)) ||
                    (/^[A-Z\s\-&]{6,}$/.test(t) && !/\d/.test(t)) ||
                    /^[📊🖥🏥🎛📈🎯⚡🏗☁🌐🔒🗄📨🔧⚙]/u.test(t)) {
                    const clean = t.replace(/^[📊🖥🏥🎛📈🎯⚡🏗☁🌐🔒🗄📨🔧⚙]\s*/u,'')
                                   .replace(/[[\]]/g,'').trim();
                    if (clean && clean !== lastSection && clean !== title) {
                        lastSection = clean;
                        kvHtml += `<div class="dash-section-label">${clean}</div>`;
                    }
                    return;
                }

                if (t.includes(':')) {
                    const ci  = t.indexOf(':');
                    const lbl = t.substring(0, ci).trim();
                    const val = t.substring(ci + 1).trim();
                    if (lbl && val) {
                        const isErr = /error|fail|critical|down/i.test(val);
                        kvHtml += `<div class="kv-row"><span class="kv-label">${formatMarkdown(lbl)}</span><span class="kv-value ${isErr?'err':''}">${formatMarkdown(val)}</span></div>`;
                        return;
                    }
                }

                if (/^[•-]/.test(t) || /^(tip|note):/i.test(t)) {
                    kvHtml += `<div class="tip-strip">${formatMarkdown(t.replace(/^[-•]\s*/,''))}</div>`;
                    return;
                }

                if (t.length > 2) {
                    kvHtml += `<div class="kv-row"><span class="kv-label" style="color:#444">${formatMarkdown(t)}</span></div>`;
                }
            });

            return kvHtml;
        }

        /* ── Main structured formatter ─────────────────── */
        function splitSvcSections(lines) {
            const _SVC_HDR = /^(WEB APP|FUNCTION APP|EVENT HUB|DATABASE|APP SERVICE|STORAGE ACCOUNT|COSMOS DB|SERVICE BUS|AKS|CONTAINER APP)\s*[—\-–]+\s*(.+)$/i;
            const rawSections = [];
            let _curSec = [];
            for (const line of lines) {
                if (/^─{10,}$/.test(line.trim())) {
                    rawSections.push(_curSec);
                    _curSec = [];
                } else {
                    _curSec.push(line);
                }
            }
            rawSections.push(_curSec);

            const svcLineSet = new Set();
            const svcCards = [];
            for (const sec of rawSections) {
                const first = sec.find(l => l.trim());
                if (!first) continue;
                const m = first.trim().match(_SVC_HDR);
                if (m) {
                    sec.forEach(l => svcLineSet.add(l));
                    svcCards.push({ type: m[1].trim().toUpperCase(), name: m[2].trim(), lines: sec.slice(sec.indexOf(first) + 1) });
                }
            }
            return { svcCards, svcLineSet };
        }

        function formatPerformanceMetrics(text) {
            const lines      = text.split('\n');
            const sysMetrics = extractSystemMetrics(text);
            const healthSvcs = extractHealthLines(lines);
            const procItems  = extractProcessLines(lines);

            const { title, subtitle } = findTitleSubtitle(lines);

            let bodyHtml = '';
            if (sysMetrics) bodyHtml += buildMetricGrid(sysMetrics);
            if (healthSvcs) bodyHtml += buildStatusGrid(healthSvcs);
            if (procItems)  bodyHtml += buildProcessList(procItems);

            const { svcCards, svcLineSet: _svcLineSet } = splitSvcSections(lines);

            if (svcCards.length > 0) {
                bodyHtml += '<div class="svc-cards-wrap">';
                for (const s of svcCards) {
                    bodyHtml += renderAzureServiceCard(s.type, s.name, s.lines);
                }
                bodyHtml += '</div>';
            }

            if (svcCards.length > 0) {
                return `<div class="dash-card">
                <div class="dash-header">
                    <div class="dash-header-title">${title || 'Monitoring Report'}</div>
                    ${subtitle ? `<div class="dash-header-sub">${subtitle}</div>` : ''}
                </div>
                ${bodyHtml || `<div style="padding:14px;font-size:13px;color:#666">${text.replace('\n','<br>')}</div>`}
            </div>`;
            }

            const skipLine = line => {
                if (_svcLineSet.has(line)) return true;
                const t = line.trim();
                if (!t || /^[─═=-]{5,}$/.test(t)) return true;
                if (sysMetrics && /^(CPU|Memory|Disk|Network|Uptime|Available|Free)/i.test(t) && t.includes(':')) return true;
                if (healthSvcs && /[✅❌]/.test(t)) return true;
                if (procItems  && /^\s*\d+[.)]\s/.test(t) && /CPU:/i.test(t)) return true;
                return false;
            };

            const kvHtml = buildKvSection(lines, skipLine, title);
            if (kvHtml) bodyHtml += `<div class="kv-table">${kvHtml}</div>`;

            return `<div class="dash-card">
                <div class="dash-header">
                    <div class="dash-header-title">${title || 'Monitoring Report'}</div>
                    ${subtitle ? `<div class="dash-header-sub">${subtitle}</div>` : ''}
                </div>
                ${bodyHtml || `<div style="padding:14px;font-size:13px;color:#666">${text.replace('\n','<br>')}</div>`}
            </div>`;
        }

        /* ── DOM helpers ───────────────────────────────── */
        function scrollToBottom() { /* auto-scroll disabled */ }

        /* ── Azure dashboard per-service detail card ─── */
        // KEY_METRICS: which metric labels to pull into the summary tile grid per service type
        const _AZ_KEY_METRICS = {
            'WEB APP':        ['CPU Time', 'memory working set', 'Requests'],
            'FUNCTION APP':   ['Requests', 'Response Time', 'Data In', 'Data Out'],
            'EVENT HUB':      ['Incoming Messages', 'Outgoing Messages', 'Active Connections'],
            'DATABASE':       ['CPU percentage', 'Availability'],
        };

        function detectServiceStatus(sectionLines) {
            let status = 'Online', isOffline = false;
            for (const line of sectionLines) {
                if (/state\s*:.*\[(stopped|offline|error)\]/i.test(line) ||
                    /availability\s*:.*stopped/i.test(line)) {
                    status = 'Offline'; isOffline = true; break;
                }
            }
            return { status, isOffline };
        }

        function parseSubsections(sectionLines) {
            const subsections = [];
            let cur = null;
            for (const line of sectionLines) {
                const t = line.trim();
                if (!t || /^[─═]{5,}$/.test(t)) continue;
                const subM = t.match(/^\[([^\]]+)\](.+)?$/);
                if (subM) {
                    if (cur) subsections.push(cur);
                    const extra = (subM[2] || '').trim();
                    cur = { label: subM[1].trim() + (extra ? ` ${extra}` : ''), rows: [] };
                } else if (cur) {
                    cur.rows.push(t);
                }
            }
            if (cur) subsections.push(cur);
            return subsections;
        }

        function findRowVal(subsections, want, norm) {
            for (const sub of subsections) {
                for (const row of sub.rows) {
                    const ci = row.indexOf(':');
                    if (ci < 0) continue;
                    const lbl = row.substring(0, ci).trim();
                    if (!norm(lbl).includes(norm(want))) continue;
                    return { val: row.substring(ci + 1).trim(), lbl };
                }
            }
            return null;
        }

        function parseTileNum(val, lbl) {
            let matchM = val.match(/avg\s*=\s*([\d.]+)\s*([a-zA-Z%/]*)/);
            if (!matchM) matchM = val.match(/total\s*\(window\)\s*=\s*([\d.]+)\s*([a-zA-Z%/]*)/);
            if (!matchM) matchM = val.match(/total\s*=\s*([\d.]+)\s*([a-zA-Z%/]*)/);
            if (!matchM) return null;
            let num = Number.parseFloat(matchM[1]);
            let unit = matchM[2] || '';
            if (unit === '' && num > 100000 && /memory|bytes|data/i.test(lbl)) {
                num = (num / (1024 * 1024)).toFixed(0); unit = 'MB';
            } else {
                num = (num % 1 === 0) ? String(Math.round(num)) : num.toFixed(2);
            }
            return { num: String(num), unit };
        }

        function extractMetricTiles(subsections, wantedLabels) {
            const tiles = [];
            const norm = s => s.toLowerCase().replace(/\s/g, '');
            for (const want of wantedLabels) {
                const found = findRowVal(subsections, want, norm);
                if (!found) continue;
                const parsed = parseTileNum(found.val, found.lbl);
                if (!parsed) continue;
                tiles.push({ label: want, num: parsed.num, unit: parsed.unit });
            }
            return tiles;
        }

        function renderAzureServiceCard(type, name, sectionLines) {
            const { status, isOffline } = detectServiceStatus(sectionLines);
            const subsections = parseSubsections(sectionLines);

            const typeKey = type.toUpperCase();
            const wantedLabels = _AZ_KEY_METRICS[typeKey] || [];
            const tiles = extractMetricTiles(subsections, wantedLabels);

            const tileHtml = tiles.map(m => {
                const friendlyLbl = _friendlyName(m.label);
                const descKey = m.label.toLowerCase().replace(/[\s_.]/g,'');
                const metricDesc = CHART_DESCRIPTIONS[descKey] || '';
                return `<div class="svc-card-metric" title="${metricDesc}">
                    <div class="svc-card-metric-label">${friendlyLbl}</div>
                    <div class="svc-card-metric-value">${m.num}${m.unit ? `<span class="svc-card-metric-unit"> ${m.unit}</span>` : ''}</div>
                </div>`;
            }).join('');

            const statusCls = isOffline ? 'offline' : 'online';
            const dotCls    = isOffline ? 'err' : 'ok';

            return `<div class="svc-card">
                <div class="svc-card-head">
                    <div class="svc-card-titles">
                        <div class="svc-card-type">${type}</div>
                        ${name ? `<div class="svc-card-name">${name}</div>` : ''}
                    </div>
                    <span class="svc-card-status ${statusCls}">
                        <span class="svc-dot-led ${dotCls}"></span>${status}
                    </span>
                </div>
                ${tileHtml ? `<div class="svc-card-body">${tileHtml}</div>` : ''}
            </div>`;
        }

        function parseServiceVal(val) {
            const dashParts = val.split(/\s+[—–-]\s+/);
            if (dashParts.length >= 2) {
                return { status: dashParts[0].trim(), metricsStr: dashParts.slice(1).join(' — ').trim() };
            }
            const sm = val.match(/^(Online|Offline|Up|Down|Healthy|Unhealthy|Available|Unavailable|Unknown|Degraded)\s*[,—–-]?\s*(.*)$/i);
            if (sm) {
                return { status: sm[1], metricsStr: (sm[2] || '').trim() };
            }
            return { status: val.trim(), metricsStr: '' };
        }

        function buildServiceMetrics(metricsStr) {
            let metricsHtml = '';
            if (metricsStr) {
                const items = metricsStr.split(',').map(s => s.trim()).filter(Boolean);
                for (const m of items) {
                    const mm = m.match(/^(.+?)\s+(\d[\d.,]*)\s*(MB|GB|KB|TB|%|ms|s|seconds|count|req|rpm|rps|KB\/s|MB\/s)?$/i);
                    if (mm) {
                        const rawLabel = mm[1].trim();
                        const label = _friendlyName(rawLabel);
                        const num   = mm[2];
                        const unit  = mm[3] || '';
                        const descKey = rawLabel.toLowerCase().replace(/[\s_.]/g,'');
                        const metricDesc = CHART_DESCRIPTIONS[descKey] || '';
                        metricsHtml += `<div class="svc-card-metric" title="${metricDesc}">
                            <div class="svc-card-metric-label">${label}</div>
                            <div class="svc-card-metric-value">${num}${unit ? `<span class="svc-card-metric-unit"> ${unit}</span>` : ''}</div>
                        </div>`;
                    } else {
                        metricsHtml += `<div class="svc-card-metric"><div class="svc-card-metric-value" style="font-size:13px; font-weight:600;">${m}</div></div>`;
                    }
                }
            }
            return metricsHtml;
        }

        /* ── Service card (one per cloud resource) ──── */
        function renderServiceCard(key, val) {
            const keyM = key.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
            const type = keyM ? keyM[1].trim() : key.trim();
            const name = keyM ? keyM[2].trim() : '';

            const { status, metricsStr } = parseServiceVal(val);

            const isOffline = /offline|down|error|fail|unavail/i.test(status);
            const statusCls = isOffline ? 'offline' : 'online';
            const dotCls    = isOffline ? 'err' : 'ok';

            const metricsHtml = buildServiceMetrics(metricsStr);

            return `<div class="svc-card">
                <div class="svc-card-head">
                    <div class="svc-card-titles">
                        <div class="svc-card-type">${type}</div>
                        ${name ? `<div class="svc-card-name">${name}</div>` : ''}
                    </div>
                    <span class="svc-card-status ${statusCls}">
                        <span class="svc-dot-led ${dotCls}"></span>${status || 'Unknown'}
                    </span>
                </div>
                ${metricsHtml ? `<div class="svc-card-body">${metricsHtml}</div>` : ''}
            </div>`;
        }

        /* ── Inline SVG line chart ──────────────────── */
        function renderChart(chart) {
            if (!chart || !Array.isArray(chart.t) || !Array.isArray(chart.v) || chart.v.length < 2) return '';
            const W = 420, H = 155, pad = { t: 24, r: 12, b: 30, l: 44 };
            const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
            const unit = (chart.unit || '').trim();
            const t = chart.t;

            // Auto-scale bytes to MB/KB when Azure Monitor returns raw bytes
            let v = chart.v.slice();
            { const nonNull = v.filter(x => x !== null && x !== undefined);
              const avg = nonNull.length ? nonNull.reduce((a, b) => a + b, 0) / nonNull.length : 0;
              if (unit === 'MB' && avg > 1e5)
                  v = v.map(x => x == null ? x : Math.round(x / 1048576 * 100) / 100);
              else if (unit === 'KB' && avg > 1e5)
                  v = v.map(x => x == null ? x : Math.round(x / 1024 * 100) / 100); }

            const nonNull2 = v.filter(x => x !== null && x !== undefined);
            const vMin = nonNull2.length ? Math.min(...nonNull2) : 0;
            const vMax = nonNull2.length ? Math.max(...nonNull2) : 1;
            const padV = (vMax - vMin) * 0.1 || Math.abs(vMax) * 0.1 || 1;
            const yMin = vMin - padV, yMax = vMax + padV, yRange = yMax - yMin || 1;

            // Per-point SVG coords for hover
            const ptCoords = v.map((val, i) => {
                const x = pad.l + (i / (v.length - 1)) * iw;
                const y = val == null ? (pad.t + ih) : (pad.t + ih - ((val - yMin) / yRange) * ih);
                return { x, y };
            });
            const pts  = ptCoords.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
            const area = `${pad.l},${pad.t + ih} ${pts} ${pad.l + iw},${pad.t + ih}`;

            const fmtT = iso => {
                const d = new Date(iso); if (isNaN(d)) return iso;
                const mo = d.toLocaleString('default', { month: 'short' });
                return `${mo} ${d.getDate()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            };
            const fmtV = n => {
                if (n === null || n === undefined) return 'n/a';
                if (Math.abs(n) >= 1000) return n.toFixed(0);
                if (Math.abs(n) >= 1) return n.toFixed(2);
                return n.toFixed(3);
            };

            const gid     = `grad-${Math.random().toString(36).slice(2, 9)}`;
            const chartId = `chrt-${Math.random().toString(36).slice(2, 9)}`;

            // Normalize name key (strip spaces, underscores, dots, parens — all lowercase)
            const nameKey = (chart.name || '').toLowerCase().replace(/[\s_.()]/g, '');

            // Normalize verbose Azure Monitor unit strings to short display forms
            const _unitMap = { 'seconds':'s', 'milliseconds':'ms', 'bytes':'B',
                               'kilobytes':'KB', 'megabytes':'MB', 'gigabytes':'GB',
                               'percent':'%', 'count':'', 'countpersecond':'/s',
                               'bytespersecond':'B/s' };
            const displayUnit = _unitMap[unit.toLowerCase()] ?? unit;

            // Store data for hover handler (use displayUnit so tooltip shows corrected unit)
            _chartDataStore[chartId] = { t, v, ptCoords, pad, iw, ih, yMin, yRange, unit: displayUnit };

            // Service tag
            const svcName = _getServiceName(nameKey, chart.layer || '');
            const svcSlug = svcName.toLowerCase().replace(/\s+/g,'');
            const svcTag  = svcName
                ? `<span class="chart-service-tag svc-${svcSlug}">${svcName}</span>`
                : '';

            // Primary vs secondary — service-aware (2 for webapp/database, major for others)
            const svcPrimarySet = PRIMARY_CHARTS_BY_SERVICE[svcSlug];
            const isPrimary = svcPrimarySet ? svcPrimarySet.has(nameKey) : PRIMARY_CHARTS.has(nameKey);

            // Description
            const desc = CHART_DESCRIPTIONS[nameKey] || '';

            // Friendly title — prefer human-readable label; fall back to API key lookup
            const friendlyTitle = (chart.label ? _friendlyName(chart.label) || chart.label : null) || _friendlyName(chart.name);
            const titleStr = `${friendlyTitle}${displayUnit ? ' (' + displayUnit + ')' : ''}`;

            // Bucket + insight (based on latest non-null value)
            const latestVal = nonNull2.length ? nonNull2[nonNull2.length - 1] : null;
            const { bucket, label: bucketLabel, cssClass: bucketCls } = _getMetricBucket(nameKey, latestVal);
            const insightText = _getInsightText(nameKey, bucket);
            const bucketIcon  = bucket === 'Normal' ? '●' : bucket === 'Warning' ? '▲' : bucket === 'Critical' ? '■' : 'ℹ';

            // Current value formatted for insight row (use displayUnit)
            const currentDisplay = latestVal != null ? `${fmtV(latestVal)}${displayUnit ? ' ' + displayUnit : ''}` : '—';

            // 30-day baseline annotation (if backend provided it)
            const baseline = chart.baseline_30d;
            let baselineStr = '';
            if (baseline && latestVal != null) {
                const bUnit = displayUnit || '';
                if (baseline.mean != null) baselineStr += ` · 30d avg: ${fmtV(baseline.mean)}${bUnit ? ' ' + bUnit : ''}`;
                if (baseline.max  != null) baselineStr += `, peak: ${fmtV(baseline.max)}${bUnit ? ' ' + bUnit : ''}`;
            }

            const insightRowHtml = (insightText || latestVal != null) ? `
                <div class="metric-insight-row">
                    <span class="metric-bucket-badge ${bucketCls}">${bucketIcon} ${bucketLabel}</span>
                    <span class="metric-insight-text">
                        <strong>Now: ${currentDisplay}</strong>${insightText ? ' — ' + insightText : ''}${baselineStr}
                    </span>
                </div>` : '';

            const chartContent = `<div class="chart-wrap" id="cw-${chartId}">
                ${svcTag}
                <div class="chart-title">${titleStr}</div>
                ${desc ? `<div class="chart-desc">${desc}</div>` : ''}
                <div class="chart-tooltip" id="tip-${chartId}"></div>
                <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block">
                  <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="#007CC3" stop-opacity="0.22"/>
                    <stop offset="100%" stop-color="#007CC3" stop-opacity="0"/>
                  </linearGradient></defs>
                  <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ih}" stroke="#d4d4d4"/>
                  <line x1="${pad.l}" y1="${pad.t + ih}" x2="${pad.l + iw}" y2="${pad.t + ih}" stroke="#d4d4d4"/>
                  <text x="${pad.l - 6}" y="${pad.t + 8}" font-size="10" text-anchor="end" fill="#666">${fmtV(yMax)}</text>
                  <text x="${pad.l - 6}" y="${pad.t + ih}" font-size="10" text-anchor="end" fill="#666">${fmtV(yMin)}</text>
                  <text x="${pad.l}" y="${H - 8}" font-size="10" text-anchor="start" fill="#888">${fmtT(t[0])}</text>
                  <text x="${pad.l + iw}" y="${H - 8}" font-size="10" text-anchor="end" fill="#888">${fmtT(t[t.length - 1])}</text>
                  <polygon points="${area}" fill="url(#${gid})" stroke="none"/>
                  <polyline points="${pts}" fill="none" stroke="#007CC3" stroke-width="1.8" stroke-linejoin="round"/>
                  <line id="ch-${chartId}" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ih}"
                        stroke="#003D7A" stroke-width="1.2" stroke-dasharray="4,3" opacity="0" pointer-events="none"/>
                  <circle id="dot-${chartId}" cx="${pad.l}" cy="${pad.t}" r="4"
                          fill="#fff" stroke="#007CC3" stroke-width="2" opacity="0" pointer-events="none"/>
                  <rect x="${pad.l}" y="${pad.t}" width="${iw}" height="${ih}" fill="transparent"
                        onmousemove="chartHover(event,'${chartId}')"
                        onmouseleave="chartUnhover('${chartId}')"/>
                </svg>
                ${insightRowHtml}
            </div>`;

            if (isPrimary) return chartContent;
            return `<div class="chart-secondary">${chartContent}</div>`;
        }

        function buildActionDoneEl(executedAction) {
            const done = document.createElement('div');
            done.className = 'action-done';
            let inner = '<div class="action-done-title">✓ Action performed: ' + escapeHTML(executedAction.summary || executedAction.type || 'completed') + '</div>';
            if (executedAction.evidence_url) {
                inner += '<div><a class="action-done-link" href="' + escapeHTML(executedAction.evidence_url) + '" target="_blank" rel="noopener">Download artifact</a></div>';
            }
            const realTag = executedAction.real_action_taken ? 'Real Azure operation' : 'Sim + on-disk artifacts';
            inner += '<div class="action-done-meta">' + realTag + ' · Decided by PerformaX AI · Accepted by user</div>';
            done.innerHTML = inner;
            return done;
        }

        function buildPendingActionCard(pendingAction) {
            const card = document.createElement('div');
            const sev = pendingAction.severity || 'info';
            let severityClass;
            if (sev === 'critical') {
                severityClass = 'critical';
            } else if (sev === 'warn') {
                severityClass = 'warn';
            } else {
                severityClass = 'info';
            }
            card.className = 'action-card severity-' + severityClass;
            const eyebrow = '<div class="action-card-eyebrow">✨ Agent decision · awaiting your approval</div>';
            const summary = '<div class="action-card-summary">' + escapeHTML(pendingAction.summary || pendingAction.type || 'Action proposed') + '</div>';
            let why = '';
            if (pendingAction.rationale) {
                why = '<div class="action-card-why">'
                    + '<span class="action-card-why-label">Why this is needed</span>'
                    + escapeHTML(pendingAction.rationale)
                    + '</div>';
            }
            const meta = '<div class="action-card-meta">Decided by PerformaX AI · Service: '
                + escapeHTML(pendingAction.service || 'n/a') + '</div>';
            const buttons = '<div class="action-card-buttons">'
                + '<button class="action-btn-accept" onclick="acceptPendingAction(this)">Accept and apply</button>'
                + '<button class="action-btn-decline" onclick="declinePendingAction(this)">Decline</button>'
                + '</div>';
            card.innerHTML = eyebrow + summary + why + meta + buttons;
            card.dataset.suggestedMessage = pendingAction.suggested_user_message || '';
            return card;
        }

        function buildRecommendationsEl(recommendations) {
            const recs = document.createElement('div');
            recs.className = 'recommendations';
            recommendations.forEach(rec => {
                const chip = document.createElement('button');
                chip.className = 'recommendation-chip';
                chip.textContent = rec;
                chip.onclick = function() { sendRecommendation(this); };
                recs.appendChild(chip);
            });
            return recs;
        }

        function addMessage(content, isUser = false, recommendations = [], charts = [], pendingAction = null, executedAction = null, anomalies = [], suppressScroll = false, doppelioStats = null) {
            const chatMessages = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'agent'}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = isUser ? 'U' : 'P';

            const body = document.createElement('div');
            body.className = 'msg-body';

            const bubble = document.createElement('div');
            bubble.className = 'message-content';
            if (isUser) {
                bubble.textContent = content;
            } else {
                let html = formatResponse(content);
                if (Array.isArray(charts) && charts.length > 0) {
                    const hasLayers = charts.some(c => c.layer === 'application' || c.layer === 'communication');
                    if (hasLayers || doppelioStats) {
                        html += renderDashboardCategorized(charts, doppelioStats);
                    } else {
                        html += '<div class="charts-wrap">' + charts.map(renderChart).join('') + '</div>';
                    }
                } else if (doppelioStats) {
                    html += renderDashboardCategorized([], doppelioStats);
                }
                if (Array.isArray(charts) && charts.length > 0) {
                    if (Array.isArray(anomalies) && anomalies.length > 0) {
                        html += renderAnomalyCardsHtml(anomalies);
                    } else {
                        html += `<div class="no-anomalies-badge">
                            <span class="na-icon">✓</span>
                            <div class="na-text">
                                <div class="na-title">No anomalies detected</div>
                                <div class="na-sub">All metrics are within normal thresholds for this time window</div>
                            </div>
                        </div>`;
                    }
                } else if (Array.isArray(anomalies) && anomalies.length > 0) {
                    html += renderAnomalyCardsHtml(anomalies);
                }
                bubble.innerHTML = html;
            }
            body.appendChild(bubble);

            if (!isUser && executedAction) {
                const done = buildActionDoneEl(executedAction);
                body.appendChild(done);
                if (typeof pollAgentActions === 'function') setTimeout(pollAgentActions, 500);
            }

            if (!isUser && pendingAction) {
                body.appendChild(buildPendingActionCard(pendingAction));
            }

            if (!isUser && recommendations && recommendations.length > 0) {
                body.appendChild(buildRecommendationsEl(recommendations));
            }

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString();
            body.appendChild(time);

            msg.appendChild(avatar);
            msg.appendChild(body);
            chatMessages.appendChild(msg);
            // Smart scroll: always follow new user messages; only follow agent messages
            // if the user was already near the bottom (prevents poll/refresh from hijacking position).
            // suppressScroll=true is used by background polls so they never move the user's position.
            if (!suppressScroll) {
                const _distFromBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
                if (isUser || _distFromBottom < 150) {
                    requestAnimationFrame(() => {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    });
                }
            }
            return msg;
        }
