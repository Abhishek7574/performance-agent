        /* ── Load-test progress card ────────────────────── */
        const LT_STEPS = [
            { key: 'infra',    label: 'Infrastructure health check'                     },
            { key: 'models',   label: 'Loading available models'                        },
            { key: 'suites',   label: 'Loading test configuration'                      },
            { key: 'config',   label: 'Applying test duration settings'                 },
            { key: 'doppels',  label: 'Checking existing doppels'                       },
            { key: 'csv',      label: 'Preparing device list',       optional: true     },
            { key: 'upload',   label: 'Uploading devices to Doppelio', optional: true   },
            { key: 'create',   label: 'Setting up virtual devices',  optional: true     },
            { key: 'verify',   label: 'Verifying devices are ready', optional: true     },
            { key: 'run',      label: 'Launching load test'                             },
            { key: 'poll',     label: 'Connecting telemetry stream', optional: true     },
        ];

        // Maps backend step text fragments → step key
        const LT_STEP_MAP = [
            ['generating csv',           'csv'    ],
            ['fetching doppel models',   'models' ],
            ['fetching test suites',     'suites' ],
            ['configuring test steps',   'config' ],
            ['checking existing doppel', 'doppels'],
            ['reusing existing',         'doppels'],
            ['extending',                'doppels'],
            ['uploading csv',            'upload' ],
            ['creating',                 'create' ],
            ['verifying doppels',        'verify' ],
            ['starting test session',    'run'    ],
            ['starting telemetry',       'poll'   ],
        ];

        let _ltPollInterval      = null;
        let _ltSeenActive        = false;  // true once we've seen active=true at least once
        let _ltRenderedDoneKeys  = new Set(); // keys already ticked in the UI
        let _ltNextTickAt        = 0;      // earliest ms timestamp for next queued tick

        function _matchStep(stepText) {
            const t = (stepText || '').toLowerCase();
            for (const [frag, key] of LT_STEP_MAP) {
                if (t.includes(frag)) return key;
            }
            return null;
        }

        // Queries that manage/stop/inspect a test — never show the progress spinner
        function _isTestControlQuery(q) {
            return /\b(stop|cancel|abort|halt|kill|pause)\b/i.test(q);
        }

        function _isLoadTestQuery(q) {
            if (_isTestControlQuery(q)) return false;
            // Must have a clear load-test action intent — not just a query about doppel/model data
            const hasTestIntent = /load\s*test|run\s*test|devices?\s+test/i.test(q)
                || /\bdoppelio\b/i.test(q)
                || (/\bdoppel\b/i.test(q) && /\b(run|start|launch|test|load)\b/i.test(q));
            return hasTestIntent;
        }

        // Detect explicit run/start load test intent (now routes through LLM like all load test queries)
        function _isRunLoadTestQuery(q) {
            if (_isTestControlQuery(q)) return false;
            return /\b\d[\d,.]*\s*k?\s*devices?\b/i.test(q)
                && /\b(run|start|launch)\b.*\btest\b|\bload\s*test\b/i.test(q);
        }

        // Show live monitor card directly — no LLM needed
        function _isShowStatsQuery(q) {
            if (_isTestControlQuery(q)) return false;
            return /\b(show|display|view|open)\b.{0,40}\b(test|load|run)\b.{0,30}\b(stats|status|progress|monitor|live|metrics)\b/i.test(q)
                || /\b(live\s*monitor|live\s*stats|live\s*data|live\s*test\s*run|live\s*run)\b/i.test(q)
                || /\bmonitor\s*(the\s*)?test\b/i.test(q)
                || /\btest\s*(stats|progress|monitor)\b/i.test(q)
                || /\bcheck\s*(test\s*)?progress\b/i.test(q)
                || /\bshow\s*monitor\b/i.test(q)
                || (/\b(show|display|view)\b.{0,20}\blive\b/i.test(q) && !/\bdashboard\b/i.test(q))
                || /\b(show|list|display|what|view)\b.{0,30}\b(running|active)\b.{0,20}\btest/i.test(q)
                || /\brunning\s+test/i.test(q);
            // NOTE: "show live dashboard" / "live dashboard" intentionally excluded — routes to Azure metrics dashboard
        }

        function showLoadTestProgress() {
            _ltSeenActive       = false;
            _ltRenderedDoneKeys = new Set(); // reset step animation tracker
            _ltNextTickAt       = 0;
            const chatMessages = document.getElementById('chatMessages');
            const wrap = document.createElement('div');
            wrap.className = 'message agent';
            wrap.id = 'ltProgressMsg';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = 'P';
            wrap.appendChild(avatar);

            const body = document.createElement('div');
            body.className = 'msg-body';

            const card = document.createElement('div');
            card.className = 'lt-progress-card';
            card.id = 'ltProgressCard';
            card.innerHTML = `
                <div class="lt-progress-title">
                    <div class="lt-spinner"></div>
                    Setting up your load test…
                </div>
                ${LT_STEPS.map(s => `
                <div class="lt-step${s.optional ? ' lt-step-optional' : ''}" id="lt-step-${s.key}">
                    <div class="lt-step-icon">–</div>
                    <span>${s.label}</span>
                </div>`).join('')}
            `;

            body.appendChild(card);
            wrap.appendChild(body);
            chatMessages.appendChild(wrap);
            scrollToBottom();

            // Poll /api/load-test-progress using recursive setTimeout (2000ms).
            // Each fetch must complete before the next fires — prevents request
            // pile-up when the infra-check or doppel setup is slow.
            _ltNextTickAt = Date.now();
            if (_ltPollInterval) { clearTimeout(_ltPollInterval); _ltPollInterval = null; }

            const _runProgressPoll = async () => {
                if (!document.getElementById('ltProgressCard')) {
                    _ltPollInterval = null; return;
                }
                const r = await fetch(`${API_BASE_URL}/api/load-test-progress`).catch(() => null);
                if (r && r.ok) {
                    const d = await r.json();
                    // Update spinner title with current step so user sees live progress
                    if (d.step && d.step !== 'done' && d.step !== 'error') {
                        const liveCard = document.getElementById('ltProgressCard');
                        const titleEl = liveCard && liveCard.querySelector('.lt-progress-title');
                        if (titleEl) titleEl.innerHTML = `<div class="lt-spinner"></div>${d.step}`;
                    }
                    if (d.step !== 'error') {
                        const doneKeys = new Set((d.steps_done || []).map(_matchStep).filter(Boolean));
                        const toTick = [];
                        for (const s of LT_STEPS) {
                            if (_ltRenderedDoneKeys.has(s.key)) continue;
                            const shouldTick = s.key === 'infra'
                                ? d.infra_status && d.infra_status !== 'checking'
                                : doneKeys.has(s.key);
                            if (shouldTick) toTick.push(s);
                        }
                        toTick.forEach(s => {
                            const delay = Math.max(0, _ltNextTickAt - Date.now());
                            _ltNextTickAt = Date.now() + delay + 500;
                            _ltRenderedDoneKeys.add(s.key);
                            setTimeout(() => {
                                const el = document.getElementById(`lt-step-${s.key}`);
                                if (!el) return;
                                if (s.optional) el.classList.remove('lt-step-optional');
                                const failed = s.key === 'infra' && d.infra_status === 'failed';
                                el.className = failed ? 'lt-step error' : 'lt-step done';
                                el.querySelector('.lt-step-icon').textContent = failed ? '✗' : '✓';
                            }, delay);
                        });
                    }
                }
                // Schedule next poll only after this fetch is fully done
                if (document.getElementById('ltProgressCard')) {
                    _ltPollInterval = setTimeout(_runProgressPoll, 800);
                } else {
                    _ltPollInterval = null;
                }
            };
            _ltPollInterval = setTimeout(_runProgressPoll, 800);
        }

        function hideLoadTestProgress() {
            if (_ltPollInterval) { clearTimeout(_ltPollInterval); _ltPollInterval = null; }
            const el = document.getElementById('ltProgressMsg');
            if (el) el.remove();
        }

        /* ── Live test monitor ─────────────────────────── */
        let _ltMonitorInterval   = null;
        let _ltDashboardInterval = null;  // 30s Azure dashboard auto-refresh
        const _ltLastGoodDevices = {};    // sid → last non-zero devices_connected (glitch protection)

        function _startDashboardPolling() {
            if (_ltDashboardInterval) return; // already running
            _ltDashboardInterval = setInterval(() => {
                const existingWrap = document.getElementById('ltAzureDashboardWrap');
                if (!existingWrap) { clearInterval(_ltDashboardInterval); _ltDashboardInterval = null; return; }
                // Use runQuery so the full chart rendering pipeline runs (same as initial render).
                // afterRender receives the newly-added message wrap — we swap its content into
                // the existing dashboard bubble and then remove the temporary wrap.
                runQuery('show azure dashboard', {
                    save: false,
                    showUserBubble: false,
                    showTyping: false,
                    hideCharts: false,
                    blockInput: false,
                    noScroll: true,
                    afterRender: (newWrap) => {
                        if (!newWrap) return;
                        const existingBubble = existingWrap.querySelector('.msg-body');
                        const newBubble      = newWrap.querySelector('.msg-body');
                        if (existingBubble && newBubble) {
                            // Preserve the refresh footer then swap content
                            existingBubble.innerHTML = newBubble.innerHTML;
                            // Re-attach footer with updated timestamp
                            const footer = document.createElement('div');
                            footer.className = 'lt-dashboard-refresh-footer';
                            footer.innerHTML = '<span>Refreshes every 30s</span>'
                                + `<span>Last updated: ${new Date().toLocaleTimeString()}</span>`;
                            existingBubble.appendChild(footer);
                        }
                        // Remove the temporary message bubble that runQuery added
                        newWrap.remove();
                    }
                });
            }, 30000);
        }

        function _stopDashboardPolling() {
            if (_ltDashboardInterval) { clearInterval(_ltDashboardInterval); _ltDashboardInterval = null; }
            const wrap = document.getElementById('ltAzureDashboardWrap');
            if (wrap) {
                const footer = wrap.querySelector('.lt-dashboard-refresh-footer');
                if (footer) footer.innerHTML =
                    '<span>Auto-refresh stopped</span>'
                    + `<span>Last updated: ${new Date().toLocaleTimeString()}</span>`;
            }
        }

        function _stopAllPolling(status) {
            _stopMonitor(true, status || 'Stopped');
            _stopDashboardPolling();
        }

        function _fmtRatio(done, total) {
            // Always show just the count — total is an estimate and can be exceeded
            return String(done || '0');
        }

        // Sanitize session_name to a safe DOM ID suffix (alphanumeric + hyphens)
        function _sidSafe(session_name) {
            return (session_name || 'default').replace(/[^a-z0-9]/gi, '-');
        }

        function showTestMonitor() {
            // Fetch once; polling interval drives updates.
            // Use tests.length > 0 (not resp.active) — Doppelio may return empty status
            // right after launch, causing is_running=false even though the test just started.
            return fetch(`${API_BASE_URL}/api/test-run-live?session=${encodeURIComponent(SESSION_ID)}`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null)
                .then(resp => {
                    if (!resp) return;
                    // Active (is_running) first, completed second
                    const tests = (resp.tests || []).sort((a, b) =>
                        (b.is_running ? 1 : 0) - (a.is_running ? 1 : 0));
                    if (tests.length === 0) return; // No tracked sessions at all
                    tests.forEach(d => _injectMonitorCard(d));
                    if (!_ltMonitorInterval) {
                        _ltMonitorInterval = setInterval(_pollMonitor, 15000);
                    }
                });
        }

        function _injectMonitorCard(d, { scroll = true } = {}) {
            const sid    = _sidSafe(d.session_name);
            const cardId = `ltMonitorCard-${sid}`;
            const wrapId = `ltMonitorWrap-${sid}`;

            // Remove existing card if present — always show brand new
            const existingWrap = document.getElementById(wrapId);
            if (existingWrap) existingWrap.remove();

            const chatMessages = document.getElementById('chatMessages');
            const savedScroll = chatMessages ? chatMessages.scrollTop : 0;
            const wrap = document.createElement('div');
            wrap.className = 'message agent';
            wrap.id = wrapId;

            const body = document.createElement('div');
            body.className = 'msg-body';

            const card = document.createElement('div');
            card.className = 'lt-monitor-card';
            card.id = cardId;
            card.dataset.session = d.session_name || '';
            card.innerHTML = _buildMonitorHTML(d, sid);

            body.appendChild(card);
            wrap.appendChild(body);
            chatMessages.appendChild(wrap);

            if (scroll) {
                scrollToBottom();
            } else {
                // Don't scroll — restore position so card injection doesn't jump the user
                requestAnimationFrame(() => { if (chatMessages) chatMessages.scrollTop = savedScroll; });
            }

            if (!_ltMonitorInterval) {
                _ltMonitorInterval = setInterval(_pollMonitor, 15000);
            }
        }

        function _normStatus(raw, isRunning, devsConnected, msgsSent) {
            // Devices still initializing — show "Starting" until real data arrives
            if (isRunning && !(devsConnected) && !(msgsSent)) return 'Starting';
            const s = (raw || '').toLowerCase();
            if (!isRunning) {
                // Test has ended — never show Running/Starting regardless of stale API status
                if (s === 'error' || s === 'failed') return 'Error';
                return 'Completed';
            }
            if (s === 'starting')  return 'Running';   // Doppelio transitional state → Running
            if (s === 'stopping')  return 'Stopped';
            if (raw) return raw;
            return 'Running';
        }

        function _buildMonitorHTML(d, sid) {
            const connected   = d.devices_connected || 0;
            const target      = d.devices_total || d.num_devices || 0;
            const pct         = target ? Math.min(100, Math.round(connected / target * 100)) : 0;
            const devLabel    = target ? `${connected.toLocaleString()} / ${target.toLocaleString()}` : String(connected);
            const iterVal     = _fmtRatio(d.iterations_done, d.iterations_total);
            const isRunning   = d.is_running;
            const status      = _normStatus(d.status, isRunning, connected, d.messages_sent);
            
            // Determine badge class based on running state and status
            let badgeCls;
            if (isRunning) {
                badgeCls = status === 'Starting' ? 'starting' : 'running';
            } else {
                badgeCls = status === 'Error' ? 'error' : 'completed';
            }
            
            const dotCls      = isRunning ? '' : 'stopped';
            const sessionShort = (d.session_name || '').replace(/^load-/, '');
            const runNote     = d.session_run_no ? ` · Run #${d.session_run_no}` : '';
            const durationNote = d.duration_mins ? ` · ${d.duration_mins} min` : '';
            const startedAt   = d.started_at ? new Date(d.started_at + 'Z').toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
            const startedNote = startedAt ? ` · Started ${startedAt}` : '';

            return `
                <div class="lt-monitor-header">
                    <span class="lt-live-dot ${dotCls}" id="ltLiveDot-${sid}"></span>
                    <span>${isRunning ? 'LIVE' : 'DONE'} &nbsp;·&nbsp; ${sessionShort}${durationNote}${runNote}${startedNote}</span>
                    <button class="copy-btn" onclick="copyToClip('${(d.session_name||'').replace(/'/g,"\\'")}',this)" title="Copy full session name">⎘</button>
                </div>
                <div class="lt-device-bar-wrap">
                    <div class="lt-device-bar-row">
                        <span class="lt-device-bar-label">Devices connecting</span>
                        <span class="lt-device-bar-val" id="ltDevices-${sid}">${devLabel}</span>
                    </div>
                    <div class="lt-device-bar-track">
                        <div class="lt-device-bar-fill" id="ltDeviceBar-${sid}" style="width:${pct}%"></div>
                    </div>
                </div>
                <div class="lt-metric-grid">
                    <div class="lt-metric-tile">
                        <span class="lt-metric-label">Messages</span>
                        <span class="lt-metric-value" id="ltMessages-${sid}">${(d.messages_sent || 0).toLocaleString()}</span>
                        <span class="lt-metric-sub">sent</span>
                    </div>
                    <div class="lt-metric-tile">
                        <span class="lt-metric-label">Iterations</span>
                        <span class="lt-metric-value" id="ltIterations-${sid}">${iterVal}</span>
                        <span class="lt-metric-sub">done</span>
                    </div>
                    <div class="lt-metric-tile" style="background:transparent;padding:0;justify-content:center;align-items:flex-start;padding-top:4px;">
                        <span class="lt-badge ${badgeCls}" id="ltBadge-${sid}">● ${status}</span>
                    </div>
                </div>
                <div class="lt-refresh-footer" id="ltFooter-${sid}">
                    ${isRunning
                        ? `<span>Refreshes every 15s</span><span id="ltLastUpdated-${sid}">Last updated: ${new Date().toLocaleTimeString()}</span>`
                        : `<span>Test complete</span>
                           <button class="lt-insight-btn" onclick="document.getElementById('chatInput').value='Show test session insights for ${d.session_name}';sendMessage()">📊 Show Insights</button>`
                    }
                </div>`;
        }

        function _updateMetric(id, newVal) {
            const el = document.getElementById(id);
            if (!el || el.textContent === String(newVal)) return;
            el.textContent = newVal;
            el.classList.remove('pulse');
            // Trigger reflow to restart animation
            el.getBoundingClientRect();
            el.classList.add('pulse');
        }

        function _badgeCls(d, liveStatus) {
            if (d.is_running) return liveStatus === 'Starting' ? 'starting' : 'running';
            return liveStatus === 'Error' ? 'error' : 'completed';
        }

        function _pollMonitor() {
            fetch(`${API_BASE_URL}/api/test-run-live?session=${encodeURIComponent(SESSION_ID)}`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null)
                .then(resp => {
                    if (!resp) return;
                    // Active first, completed second — keep active cards at top
                    const tests = (resp.tests || []).sort((a, b) =>
                        (b.is_running ? 1 : 0) - (a.is_running ? 1 : 0));
                    // Stop only when backend tracks zero sessions — not when some tests finished
                    if (tests.length === 0) {
                        // Mark any still-visible running cards as stopped/failed
                        document.querySelectorAll('.lt-badge.running, .lt-badge.starting').forEach(badge => {
                            badge.textContent = '● Stopped';
                            badge.className = 'lt-badge completed';
                            const sid = badge.id.replace('ltBadge-', '');
                            const dot = document.getElementById(`ltLiveDot-${sid}`);
                            if (dot) dot.classList.add('stopped');
                        });
                        _stopMonitor(false);
                        _stopDashboardPolling();
                        return;
                    }

                    const chatMessages = document.getElementById('chatMessages');

                    // Inject cards for new replacement sessions; remove stale stopped cards first
                    const activeSids = new Set(tests.map(d => _sidSafe(d.session_name)));
                    const hasNewSession = tests.some(d => !document.getElementById(`ltMonitorCard-${_sidSafe(d.session_name)}`));
                    if (hasNewSession) {
                        // Remove stopped/completed cards that are NOT in the current active set
                        document.querySelectorAll('.lt-monitor-card').forEach(card => {
                            const cardSid = _sidSafe(card.dataset.session || '');
                            if (!activeSids.has(cardSid)) {
                                const wrap = card.closest('.message.agent');
                                if (wrap) wrap.remove();
                            }
                        });
                        // Inject cards for sessions that still don't have one (no scroll — user may be reading)
                        tests.forEach(d => {
                            if (!document.getElementById(`ltMonitorCard-${_sidSafe(d.session_name)}`)) {
                                _injectMonitorCard(d, { scroll: false });
                            }
                        });
                    }

                    let allDone = true;
                    tests.forEach(d => {
                        const sid = _sidSafe(d.session_name);
                        if (!document.getElementById(`ltMonitorCard-${sid}`)) return; // card not yet injected

                        const rawConnected = d.devices_connected || 0;
                        // Glitch protection: if API returns 0 but we previously had a real value, keep it
                        if (rawConnected > 0) _ltLastGoodDevices[sid] = rawConnected;
                        const connected = (rawConnected === 0 && _ltLastGoodDevices[sid] && d.is_running)
                            ? _ltLastGoodDevices[sid] : rawConnected;
                        const target    = d.devices_total || d.num_devices || 0;
                        const pct       = target ? Math.min(100, Math.round(connected / target * 100)) : 0;
                        const devLabel  = target ? `${connected.toLocaleString()} / ${target.toLocaleString()}` : String(connected);
                        const iterVal   = _fmtRatio(d.iterations_done, d.iterations_total);
                        const liveStatus = _normStatus(d.status, d.is_running, connected, d.messages_sent);

                        _updateMetric(`ltDevices-${sid}`,    devLabel);
                        _updateMetric(`ltMessages-${sid}`,   (d.messages_sent  || 0).toLocaleString());
                        _updateMetric(`ltIterations-${sid}`, iterVal);

                        const bar = document.getElementById(`ltDeviceBar-${sid}`);
                        if (bar) bar.style.width = pct + '%';

                        const badge = document.getElementById(`ltBadge-${sid}`);
                        if (badge) {
                            badge.textContent = `● ${liveStatus}`;
                            const badgeCls = _badgeCls(d, liveStatus);
                            badge.className = `lt-badge ${badgeCls}`;
                        }

                        const tsEl = document.getElementById(`ltLastUpdated-${sid}`);
                        if (tsEl) tsEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;

                        if (d.is_running) {
                            allDone = false;
                        } else {
                            _stopMonitorForSession(d.session_name, true, liveStatus);
                        }
                    });

                    if (allDone) {
                        if (_ltMonitorInterval) { clearInterval(_ltMonitorInterval); _ltMonitorInterval = null; }
                        _stopDashboardPolling();
                    }

                });
        }

        function _stopMonitorForSession(session_name, updateBadge, status) {
            const sid   = _sidSafe(session_name);
            const dot   = document.getElementById(`ltLiveDot-${sid}`);
            const badge = document.getElementById(`ltBadge-${sid}`);
            if (dot) dot.classList.add('stopped');
            if (badge && updateBadge) {
                const s = status || 'Completed';
                const cls = s === 'Error' ? 'error' : 'completed';
                badge.className = `lt-badge ${cls}`;
                badge.textContent = `● ${s}`;
                const hdr = badge.closest('.lt-monitor-card')?.querySelector('.lt-monitor-header span:last-child');
                if (hdr) hdr.textContent = hdr.textContent.replace(/^LIVE/, 'DONE');
            }
            // Swap refresh footer → insights button
            const footer = document.getElementById(`ltFooter-${sid}`);
            if (footer && !footer.querySelector('.lt-insight-btn')) {
                const safeSession = (session_name || '').replace(/'/g, "\\'");
                footer.innerHTML = `<span>Test complete</span>
                    <button class="lt-insight-btn" onclick="document.getElementById('chatInput').value='Show test session insights for ${session_name}';sendMessage()">📊 Show Insights</button>`;
            }
        }

        function _stopMonitor(updateBadge, status) {
            if (_ltMonitorInterval) { clearInterval(_ltMonitorInterval); _ltMonitorInterval = null; }
            document.querySelectorAll('.lt-monitor-card').forEach(card => {
                if (card.dataset.session) _stopMonitorForSession(card.dataset.session, updateBadge, status);
            });
        }

        function hideTestMonitor() {
            if (_ltMonitorInterval) { clearInterval(_ltMonitorInterval); _ltMonitorInterval = null; }
            document.querySelectorAll('[id^="ltMonitorWrap-"]').forEach(el => {
                if (el._ltObserver) { el._ltObserver.disconnect(); el._ltObserver = null; }
                el.remove();
            });
        }

        /* ── LT progress helpers ── */
        function _ltTickStep(s, delay) {
            _ltRenderedDoneKeys.add(s.key);
            setTimeout(() => {
                const el = document.getElementById(`lt-step-${s.key}`);
                if (!el) return;
                if (s.optional) el.classList.remove('lt-step-optional');
                el.className = 'lt-step done';
                el.querySelector('.lt-step-icon').textContent = '✓';
            }, delay);
        }

        function _ltCollectPendingSteps(finalDoneKeys, infraStatus) {
            const toProcess = [];
            for (const s of LT_STEPS) {
                if (_ltRenderedDoneKeys.has(s.key)) continue;
                const el = document.getElementById(`lt-step-${s.key}`);
                if (!el || el.classList.contains('lt-step-optional')) continue;
                const isDone = s.key === 'infra' ? infraStatus === 'ok' : finalDoneKeys.has(s.key);
                if (isDone) toProcess.push(s);
            }
            return toProcess;
        }

        /* ── Force-complete LT progress card then remove it ── */
        async function _completeLTProgress() {
            if (_ltPollInterval) { clearTimeout(_ltPollInterval); _ltPollInterval = null; }

            let finalDoneKeys = new Set();
            let infraStatus = '';
            let progressError = '';
            let progressStep = '';
            try {
                const r = await fetch(`${API_BASE_URL}/api/load-test-progress`);
                if (r.ok) {
                    const d = await r.json();
                    finalDoneKeys = new Set((d.steps_done || []).map(_matchStep).filter(Boolean));
                    infraStatus = d.infra_status || '';
                    progressStep = d.step || '';
                    progressError = d.error || '';
                }
            } catch (error) {
                console.debug('Failed to fetch load test progress:', error);
            }

            const card = document.getElementById('ltProgressCard');
            if (!card) return;
            const titleEl = card.querySelector('.lt-progress-title');

            // Backend reported a hard error (e.g. expired Doppelio token) — show failure
            if (progressStep === 'error' && progressError) {
                if (titleEl) {
                    titleEl.innerHTML = '<span style="color:#c0392b;font-size:15px">✗</span> Load test could not start';
                    titleEl.style.color = '#c0392b';
                }
                await new Promise(resolve => setTimeout(resolve, 2500));
                hideLoadTestProgress();
                return;
            }

            if (infraStatus === 'failed') {
                if (!_ltRenderedDoneKeys.has('infra')) {
                    const infraEl = document.getElementById('lt-step-infra');
                    if (infraEl) {
                        infraEl.className = 'lt-step error';
                        infraEl.querySelector('.lt-step-icon').textContent = '✗';
                    }
                }
                if (titleEl) {
                    titleEl.innerHTML = '<span style="color:#c0392b;font-size:15px">✗</span> Infrastructure not ready';
                    titleEl.style.color = '#c0392b';
                }
                await new Promise(resolve => setTimeout(resolve, 2500));
                hideLoadTestProgress();
                return;
            }

            // Reveal optional done steps
            LT_STEPS.forEach(s => {
                if (s.optional && finalDoneKeys.has(s.key)) {
                    const el = document.getElementById(`lt-step-${s.key}`);
                    if (el) el.classList.remove('lt-step-optional');
                }
            });

            // Stagger-tick remaining done steps
            _ltCollectPendingSteps(finalDoneKeys, infraStatus).forEach(s => {
                const delay = Math.max(0, _ltNextTickAt - Date.now());
                _ltNextTickAt = Date.now() + delay + 500;
                _ltTickStep(s, delay);
            });

            const totalDelay = Math.max(0, _ltNextTickAt - Date.now());
            if (titleEl) {
                setTimeout(() => {
                    if (!document.getElementById('ltProgressCard')) return;
                    titleEl.innerHTML = '<span style="color:#1a7a4a;font-size:15px">✓</span> Load test launched!';
                    titleEl.style.color = '#1a7a4a';
                }, totalDelay);
            }
            await new Promise(resolve => setTimeout(resolve, totalDelay + 1800));
            hideLoadTestProgress();
        }

        /* ── Send / receive ────────────────────────────── */
        function _lockInput(blockInput, sendButton, input) {
            if (!blockInput) return;
            document.querySelectorAll('.recommendation-chip').forEach(c => c.disabled = true);
            isProcessing = true;
            sendButton.style.display = 'none';
            const cancelBtn = document.getElementById('cancelButton');
            if (cancelBtn) cancelBtn.style.display = '';
            input.disabled = true;
        }

        async function _executeQuery(query, isLTQuery, showTyping, hideCharts, noScroll, beforeRender, afterRender) {
            const apiQuery = /\b(show\s+)?live\s+(azure\s+)?dashboard\b/i.test(query)
                ? 'show azure dashboard' : query;
            _abortController = new AbortController();
            const response = await fetch(`${API_BASE_URL}/api/chat`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ query: apiQuery, session_id: SESSION_ID, user_id: 'user' }),
                signal:  _abortController.signal,
            });
            if (!isLTQuery && showTyping) hideTypingIndicator();
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            if (typeof beforeRender === 'function') beforeRender();
            await _processApiResponse(data, isLTQuery, hideCharts, afterRender, query, noScroll);
        }

        function _handleQueryError(error, isLTQuery, showTyping, beforeRender) {
            if (error.name === 'AbortError') return; // user-cancelled — no error message
            if (isLTQuery) hideLoadTestProgress();
            else if (showTyping) hideTypingIndicator();
            if (typeof beforeRender === 'function') beforeRender();
            console.error('Error:', error);
            showError('Connection error. Please check if the agent is running.');
            addMessage("Sorry, I'm having trouble connecting. Please try again.", false, []);
        }

        function _releaseInput(blockInput, sendButton, input) {
            if (!blockInput) return;
            const cancelBtn = document.getElementById('cancelButton');
            if (cancelBtn) cancelBtn.style.display = 'none';
            sendButton.style.display = '';
            sendButton.disabled = false;
            input.disabled = false;
            document.querySelectorAll('.recommendation-chip').forEach(c => c.disabled = false);
            input.focus();
        }

        async function _handleShowStatsPath(query, blockInput, sendButton, input, showTyping) {

            try {
                const liveData = await fetch(`${API_BASE_URL}/api/test-run-live?session=${encodeURIComponent(SESSION_ID)}`)
                    .then(r => r.ok ? r.json() : null).catch(() => null);
                if (showTyping) hideTypingIndicator();
                if (liveData && (liveData.tests || []).length > 0) {
                    showTestMonitor().then(() => _showLiveAzureDashboard());
                } else {
                    addMessage('No active load test found. Start a load test first, then check live stats.', false,
                        ['Run load test for 1000 devices for 10 minutes', 'Show Azure dashboard']);
                }
                isProcessing = false;
                _releaseInput(blockInput, sendButton, input);
                return true;
            } catch (error) {
                console.debug('Failed to fetch live test data, falling back to LLM:', error);
                return false;
            }
        }

        async function _processApiResponse(data, isLTQuery, hideCharts, afterRender, query, noScroll = false) {
            if (data.success) {
                const allRecs = (data.recommendations || []).map(r => (r || '').toLowerCase());
                const recs = isLTQuery ? allRecs : [];
                const testActive = allRecs.some(r => r.includes('show live stats'));
                if (isLTQuery) {
                    if (data.pending_action) {
                        hideLoadTestProgress();
                    } else {
                        await _completeLTProgress();
                    }
                }
                if (data.messages && data.messages.length > 0) {
                    // Multi-bubble mode: render each message as a separate bubble with staggered timing
                    for (let i = 0; i < data.messages.length; i++) {
                        const msg = data.messages[i];
                        const isLast = i === data.messages.length - 1;
                        if (i > 0) await new Promise(r => setTimeout(r, 800));
                        const msgCharts = (!hideCharts && isLast) ? (msg.charts || []) : [];
                        const wrapEl = addMessage(
                            msg.response, false,
                            msg.recommendations || [],
                            msgCharts,
                            msg.pending_action || null,
                            msg.executed_action || null,
                            msg.anomalies || [],
                            noScroll,
                            msg.doppelio_stats || null
                        );
                        if (isLast) {
                            if (testActive) showTestMonitor().then(() => _showLiveAzureDashboard());
                            if (typeof afterRender === 'function' && wrapEl) afterRender(wrapEl);
                            if (_isTestControlQuery(query)) _stopAllPolling('Stopped');
                        }
                    }
                } else {
                    const charts = hideCharts ? [] : (data.charts || []);
                    const wrapEl = addMessage(data.response, false, data.recommendations || [], charts,
                               data.pending_action || null, data.executed_action || null, data.anomalies || [], noScroll,
                               data.doppelio_stats || null);
                    if (testActive) {
                        // Card order: summary card (above) → monitor card → Azure dashboard.
                        // Only injected when test confirmed running (testActive); prevents stale
                        // or other-session cards appearing when function app gives a warning message.
                        showTestMonitor().then(() => _showLiveAzureDashboard());
                    }
                    if (typeof afterRender === 'function' && wrapEl) afterRender(wrapEl);
                    if (_isTestControlQuery(query)) _stopAllPolling('Stopped');
                }
            } else {
                if (isLTQuery) hideLoadTestProgress();
                showError(data.error || 'Failed to get response');
                addMessage(data.response || 'Sorry, I encountered an error. Please try again.', false, []);
            }
        }

        async function runQuery(query, { save = true, showUserBubble = true, showTyping = true, hideCharts = false, blockInput = true, noScroll = false, beforeRender = null, afterRender = null } = {}) {
            if (!query) return;
            if (blockInput && isProcessing) return;
            const input      = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');

            _lockInput(blockInput, sendButton, input);
            if (showUserBubble) addMessage(query, true);
            if (save)           saveToHistory(query);

            const isShowStats = _isShowStatsQuery(query);
            const isLTQuery   = !isShowStats && _isLoadTestQuery(query);

            // Short-circuit: show unified/consolidated insights card without LLM
            if (/\b(show|display|view|open)\b.{0,30}\b(unified|consolidated|combined|master|summary)\b.{0,30}\b(insights?|dashboard|report|view)\b/i.test(query)
                || /\b(demo\s*insights?|all\s*agents?\s*insights?|agent\s*summary)\b/i.test(query)) {
                showUnifiedInsights();
                isProcessing = false;
                _releaseInput(blockInput, sendButton, input);
                return;
            }

            if (await _handleShowStatsPath(query, blockInput, sendButton, input, showTyping)) return;

            if (isLTQuery) {
                fetch(`${API_BASE_URL}/api/init-load-test-progress`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: SESSION_ID }),
                }).catch(() => {});
                showLoadTestProgress();
            } else if (showTyping) {
                showTypingIndicator();
            }

            try {
                await _executeQuery(query, isLTQuery, showTyping, hideCharts, noScroll, beforeRender, afterRender);
            } catch (error) {
                _handleQueryError(error, isLTQuery, showTyping, beforeRender);
            } finally {
                if (blockInput) {
                    isProcessing = false;
                    _releaseInput(blockInput, sendButton, input);
                }
            }
        }

        function cancelQuery() {
            if (_abortController) {
                _abortController.abort();
                _abortController = null;
            }
            hideTypingIndicator();
            const input      = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            isProcessing = false;
            _releaseInput(true, sendButton, input);
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const query = input.value.trim();
            if (!query) return;
            input.value = '';
            runQuery(query, { save: true, showUserBubble: true });
        }

        function loadDefaultDashboard() {
            const chatMessages = document.getElementById('chatMessages');
            const loaderMessages = [
                'Connecting to Azure\u2026',
                'Checking service status\u2026',
                'Fetching CPU metrics\u2026',
                'Fetching memory metrics\u2026',
                'Loading dashboard details\u2026',
                'Almost ready\u2026'
            ];
            chatMessages.innerHTML =
                '<div class="dashboard-loader" id="dashboardLoader">'
              +   '<div class="dashboard-loader-spinner"></div>'
              +   '<div class="dashboard-loader-text" id="dashboardLoaderText">' + loaderMessages[0] + '</div>'
              + '</div>';

            // Rotate through progress messages every ~1.6s
            let idx = 0;
            const textEl = document.getElementById('dashboardLoaderText');
            const loaderInterval = setInterval(() => {
                idx = (idx + 1) % loaderMessages.length;
                if (textEl) textEl.textContent = loaderMessages[idx];
            }, 1600);

            runQuery(
                'Show the Azure dashboard overview with the status, CPU, and memory for every service.',
                {
                    save: false,
                    showUserBubble: false,
                    showTyping: false,
                    hideCharts: true,
                    beforeRender: () => {
                        clearInterval(loaderInterval);
                        const l = document.getElementById('dashboardLoader');
                        if (l) l.remove();
                    }
                }
            );
        }

        function sendRecommendation(button) {
            document.getElementById('chatInput').value = button.textContent;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        /* ── Clipboard helper ────────────────────────────── */
        function copyToClip(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
            });
        }

        /* ── Agentic action helpers ───────────────────────── */
        function escapeHTML(s) {
            // Reuse the existing escapeHtml helper if available
            if (typeof escapeHtml === 'function') return escapeHtml(s == null ? '' : String(s));
            return String(s == null ? '' : s)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function acceptPendingAction(btn) {
            const card = btn.closest('.action-card');
            const msg = card && card.dataset && card.dataset.suggestedMessage;
            if (!msg) return;
            // Disable buttons + visually mark accepted
            card.querySelectorAll('button').forEach(b => b.disabled = true);
            const eyebrow = card.querySelector('.action-card-eyebrow');
            if (eyebrow) eyebrow.textContent = '✓ Accepted — running now';
            // Send the suggested user message through the existing chat flow
            runQuery(msg, { save: true, showUserBubble: true });
        }

        function declinePendingAction(btn) {
            const card = btn.closest('.action-card');
            if (!card) return;
            card.style.opacity = '0.5';
            card.querySelectorAll('button').forEach(b => b.disabled = true);
            const eyebrow = card.querySelector('.action-card-eyebrow');
            if (eyebrow) eyebrow.textContent = '✗ Declined';
            hideLoadTestProgress();
        }

        /* ── Sidebar tab switching ─────────────────────────── */
        function switchSidebarTab(tab) {
            const tabHistory  = document.getElementById('tabHistory');
            const tabActions  = document.getElementById('tabActions');
            const histHeader  = document.getElementById('historyHeader');
            const histSearch  = document.getElementById('historySearch');
            const histList    = document.getElementById('sidebarHistory');
            const actionsList = document.getElementById('sidebarActions');
            if (tab === 'actions') {
                tabHistory.classList.remove('active');
                tabActions.classList.add('active');
                histHeader.style.display = 'none';
                histSearch.style.display = 'none';
                histList.classList.add('hidden');
                actionsList.classList.add('active');
                pollAgentActions();
            } else {
                tabActions.classList.remove('active');
                tabHistory.classList.add('active');
                histHeader.style.display = '';
                histSearch.style.display = '';
                histList.classList.remove('hidden');
                actionsList.classList.remove('active');
            }
        }

        /* ── Agent Actions panel — polls /api/agent-actions ─ */
        async function pollAgentActions() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/agent-actions`, { method: 'GET' });
                if (!res.ok) return;
                const data = await res.json();
                renderAgentActions(data.records || []);
            } catch (_e) { console.debug(_e) }
        }

        function _shortType(t) {
            if (t === 'start_service') return 'START';
            if (t === 'save_iac_artifact') return 'SAVE IAC';
            if (t === 'tag_resource') return 'TAG';
            if (t === 'iac_apply') return 'APPLY';
            return (t || 'ACTION').toUpperCase();
        }

        function _typeIcon(t) {
            if (t === 'start_service') return '▶';
            if (t === 'save_iac_artifact') return '📄';
            if (t === 'tag_resource') return '🏷';
            return '✦';
        }

        function renderAgentActions(records) {
            const list = document.getElementById('sidebarActions');
            if (!list) return;
            if (!records.length) {
                list.innerHTML = '<div class="sidebar-empty">No agent actions yet</div>';
                return;
            }
            const items = records.map(r => {
                const result = r.result || {};
                const real = result.real_action_taken === true;
                const icon = _typeIcon(r.type);
                const typeLabel = _shortType(r.type);
                const summary = escapeHTML(result.summary || r.type || 'action');
                const why = escapeHTML(r.rationale || '');
                const when = escapeHTML(r.ts || '');
                const evidence = result.evidence || result.path;
                const isUrl = typeof evidence === 'string' && evidence.startsWith('/');
                
                // Generate evidence link based on type
                let link;
                if (isUrl) {
                    link = '<a class="action-item-link" href="' + escapeHTML(evidence) + '" target="_blank" rel="noopener">[file]</a>';
                } else if (evidence) {
                    link = '<span class="action-item-link" title="' + escapeHTML(evidence) + '">[evidence]</span>';
                } else {
                    link = '';
                }
                
                return '<div class="action-item' + (real ? ' real-action' : '') + '">'
                    + '<div class="action-item-type">' + icon + '&nbsp;' + typeLabel + (real ? ' · REAL' : '') + '</div>'
                    + '<div class="action-item-summary">' + summary + ' ' + link + '</div>'
                    + (why ? '<div class="action-item-why">' + why + '</div>' : '')
                    + '<div class="action-item-meta">' + when + ' · accepted by ' + escapeHTML(r.accepted_by || 'user') + '</div>'
                    + '</div>';
            }).join('');
            list.innerHTML = items;
        }

        window.onload = function() {
            renderHistory();
            pollAgentActions();
            setInterval(pollAgentActions, 30000);
            _loadResourceConfig();
        };
    </script>
</body>
