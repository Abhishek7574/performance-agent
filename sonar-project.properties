sonar.login=squ_baed07c40856c569c2a93b9f7fd67ddf2e6819b0
sonar.scanner.trustAllCertificates=true
sonar.projectKey=AutoVerse-Agentic-AI
sonar.branch.name=main

# Skip venv, type stubs, and hidden dirs from analysis
sonar.exclusions=**/*.pyi,**/.*/**,**/venv/**,**/.venv/**,**/node_modules/**
sonar.python.pylint.reportPath=

# Coverage report generated by: pytest tests/ --cov=tools --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

# Tell SonarQube where test files live (excluded from coverage requirements)
sonar.tests=tests
sonar.test.inclusions=tests/**

# Exclude files with heavy Azure/external dependencies that cannot be unit-tested
sonar.coverage.exclusions=\
  agents/**,\
  mcp_servers/**,\
  tools/cloudlens_iac/**,\
  tools/ragsearch/**,\
  agentic/**,\
  tests/**